[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kaizen-life-api"
version = "0.4.0"
description = "API do Kaizen Life para web, PWA e aplicativos móveis."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "sqlalchemy[asyncio]>=2.0.43,<3.0",
  "aiosqlite>=0.21,<1.0",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.16,<2.0",
  "pydantic-settings>=2.10,<3.0",
  "email-validator>=2.2,<3.0",
  "pwdlib[argon2]>=0.2.1,<1.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "httpx>=0.28,<1.0",
  "pywebpush>=2.0,<3.0",
  "firebase-admin>=6.8,<7.0",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.1,<2.0",
  "ruff>=0.12,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
