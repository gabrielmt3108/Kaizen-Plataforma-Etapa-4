function focusTimerRemaining(){
  const timer = state && state.focusProject ? state.focusProject.timer : null;
  if(!timer) return 0;
  if(!timer.running || !timer.startedAt) return Math.max(0, Number(timer.remaining)||0);
  const elapsed = Math.floor((Date.now()-timer.startedAt)/1000);
  return Math.max(0, (Number(timer.remaining)||0)-elapsed);
}
function focusStats(){
  const project = state.focusProject;
  const sessions = project.sessions || [];
  const today = localDateISO();
  const totalMinutes = sessions.reduce(function(sum,s){ return sum + (Number(s.minutes)||0); },0);
  const todayMinutes = sessions.filter(function(s){ return s.date===today; }).reduce(function(sum,s){ return sum + (Number(s.minutes)||0); },0);
  const uniqueDates = Array.from(new Set(sessions.map(function(s){ return s.date; }).filter(Boolean)));
  const dateSet = new Set(uniqueDates);
  let cursor = new Date();
  if(!dateSet.has(localDateISO(cursor))) cursor.setDate(cursor.getDate()-1);
  let streak = 0;
  while(dateSet.has(localDateISO(cursor))){
    streak += 1;
    cursor.setDate(cursor.getDate()-1);
  }
  const start = new Date((project.startedAt || today) + 'T12:00:00');
  const current = new Date(today + 'T12:00:00');
  const journeyDay = Math.max(1, Math.floor((current-start)/86400000)+1);
  const doneMilestones = project.milestones.filter(function(m){ return m.done; }).length;
  return {
    totalMinutes:totalMinutes,
    todayMinutes:todayMinutes,
    streak:streak,
    journeyDay:journeyDay,
    journeyPct:Math.min(100,Math.round(journeyDay/Math.max(1,project.targetDays||90)*100)),
    milestonePct:project.milestones.length ? Math.round(doneMilestones/project.milestones.length*100) : 0
  };
}
function focusHealthScore(){
  const h = state.focusProject.health || {};
  if(h.date!==localDateISO()) return { score:null, label:'Check-in pendente', color:'var(--text-muted)', critical:false };
  let score = 0;
  const sleep = Number(h.sleep)||0;
  const energy = Number(h.energy)||0;
  const stress = Number(h.stress)||0;
  if(sleep>=7) score += 30; else if(sleep>=6) score += 20; else if(sleep>=5) score += 10;
  score += Math.max(0,Math.min(20,energy*4));
  if(h.meals) score += 15;
  if(h.movement) score += 15;
  if(h.recovery) score += 10;
  if(stress<=2) score += 10; else if(stress===3) score += 5;
  score = Math.min(100,Math.round(score));
  const critical = sleep<5 || energy<=1 || stress>=5;
  if(critical || score<40) return {score:score,label:'Recuperação primeiro',color:'var(--danger)',critical:true};
  if(score<65) return {score:score,label:'Carga moderada',color:'var(--gold)',critical:false};
  return {score:score,label:'Pronto para focar',color:'var(--green)',critical:false};
}

/* ---------- Authentication prototype + account helpers ---------- */
function normalizeEmail(value){ return String(value||'').trim().toLowerCase(); }
function isValidEmail(value){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(normalizeEmail(value)); }
function normalizePhone(value){
  let digits=String(value||'').replace(/\D/g,'');
  if((digits.length===10 || digits.length===11) && !digits.startsWith('55')) digits='55'+digits;
  return digits ? '+'+digits : '';
}
function isValidPhone(value){ const phone=normalizePhone(value); return /^\+\d{12,13}$/.test(phone); }
function maskEmail(value){
  const email=normalizeEmail(value);
  const parts=email.split('@');
  if(parts.length!==2) return email||'Conta local';
  const head=parts[0];
  return (head.length<=2 ? head.charAt(0)+'*' : head.slice(0,2)+'***')+'@'+parts[1];
}
function maskPhone(value){
  const digits=String(value||'').replace(/\D/g,'');
  if(digits.length<8) return value||'Telefone';
  return '+'+digits.slice(0,2)+' •• '+digits.slice(-4);
}
function passwordChecks(password){
  const value=String(password||'');
  return {
    length:value.length>=12,
    lower:/[a-z]/.test(value),
    upper:/[A-Z]/.test(value),
    number:/\d/.test(value),
    special:/[^A-Za-z0-9\s]/.test(value),
    noSpace:!(/\s/.test(value)) && value.length>0
  };
}
function passwordStrength(password){
  const checks=passwordChecks(password);
  const score=['length','lower','upper','number','special'].filter(function(key){return checks[key];}).length;
  return {valid:score===5 && checks.noSpace,score:score,checks:checks,label:['Muito fraca','Fraca','Razoável','Boa','Forte','Muito forte'][score],color:score<2?'var(--danger)':(score<4?'var(--gold)':'var(--green)')};
}
function passwordStrengthHTML(inputId){
  const rules=[['length','12 ou mais caracteres'],['upper','Letra maiúscula'],['lower','Letra minúscula'],['number','Número'],['special','Símbolo'],['noSpace','Sem espaços']];
  return `<div class="password-strength" id="strength_${inputId}" style="--strength-color:var(--danger);">
    <div class="password-strength-track">${[1,2,3,4,5].map(function(i){return `<span data-strength-bar="${i}"></span>`;}).join('')}</div>
    <div class="password-strength-label"><span>Força da senha</span><strong data-strength-label>Muito fraca</strong></div>
    <div class="password-rules">${rules.map(function(rule){return `<span class="password-rule" data-password-rule="${rule[0]}">${icon('check','')} ${rule[1]}</span>`;}).join('')}</div>
  </div>`;
}
function updatePasswordStrengthUI(inputId, password){
  const box=document.getElementById('strength_'+inputId);
  if(!box) return;
  const result=passwordStrength(password);
  box.style.setProperty('--strength-color',result.color);
  const label=box.querySelector('[data-strength-label]');
  if(label) label.textContent=result.label;
  if(box.querySelectorAll){
    box.querySelectorAll('[data-strength-bar]').forEach(function(bar){bar.classList.toggle('on',Number(bar.dataset.strengthBar)<=result.score);});
    box.querySelectorAll('[data-password-rule]').forEach(function(rule){rule.classList.toggle('ok',!!result.checks[rule.dataset.passwordRule]);});
  }
}
function createPasswordSalt(){
  const cryptoObj=window.crypto || globalThis.crypto;
  if(cryptoObj && cryptoObj.getRandomValues){
    const bytes=new Uint8Array(16);
    cryptoObj.getRandomValues(bytes);
    return Array.from(bytes).map(function(v){return v.toString(16).padStart(2,'0');}).join('');
  }
  return Date.now().toString(36)+Math.random().toString(36).slice(2);
}
async function hashPassword(password, salt){
  const cryptoObj=window.crypto || globalThis.crypto;
  if(!cryptoObj || !cryptoObj.subtle || typeof TextEncoder==='undefined') throw new Error('Criptografia do navegador indisponível');
  const encoder=new TextEncoder();
  const material=await cryptoObj.subtle.importKey('raw',encoder.encode(String(password)),'PBKDF2',false,['deriveBits']);
  const derived=await cryptoObj.subtle.deriveBits({name:'PBKDF2',salt:encoder.encode(String(salt)),iterations:120000,hash:'SHA-256'},material,256);
  return Array.from(new Uint8Array(derived)).map(function(v){return v.toString(16).padStart(2,'0');}).join('');
}

/* ---------- window.storage wrappers (local persistence, per Claude.ai user) ---------- */
async function storageGet(key){
  try{
    if(window.storage && typeof window.storage.get==='function'){
      const res = await window.storage.get(key, false);
      return res ? res.value : null;
    }
    return window.localStorage ? window.localStorage.getItem(key) : null;
  } catch(err){ return null; }
}
async function storageSet(key, value){
  try{
    if(window.storage && typeof window.storage.set==='function') await window.storage.set(key, value, false);
    else if(window.localStorage) window.localStorage.setItem(key, value);
    else return false;
    return true;
  }
  catch(err){ console.error('storage set failed:', key, err); return false; }
}
async function storageDelete(key){
  try{
    if(window.storage && typeof window.storage.delete==='function') await window.storage.delete(key, false);
    else if(window.localStorage) window.localStorage.removeItem(key);
    else return false;
    return true;
  }
  catch(err){ return false; }
}

function weeklyFromCompletedDates(values){
  const weekly=[0,0,0,0,0,0,0];
  const today=new Date();
  const weekStart=new Date(today.getFullYear(),today.getMonth(),today.getDate()-today.getDay());
  const weekEnd=new Date(weekStart.getFullYear(),weekStart.getMonth(),weekStart.getDate()+7);
  (values||[]).forEach(function(value){
    const day=new Date(String(value)+'T12:00:00');
    if(day>=weekStart && day<weekEnd) weekly[day.getDay()]=1;
  });
  return weekly;
}

/* ---------- Equipped visuals (theme + wallpaper) applied to :root ---------- */
function colorLuminance(hex){
  const clean=String(hex||'').replace('#','');
  if(!/^[0-9a-f]{6}$/i.test(clean)) return 0;
  const channels=[0,2,4].map(function(i){
    const value=parseInt(clean.slice(i,i+2),16)/255;
    return value<=0.03928 ? value/12.92 : Math.pow((value+0.055)/1.055,2.4);
  });
  return channels[0]*0.2126+channels[1]*0.7152+channels[2]*0.0722;
}
function contrastText(hex){
  const luminance=colorLuminance(hex);
  const dark='#071018';
  const darkContrast=(luminance+0.05)/(colorLuminance(dark)+0.05);
  const lightContrast=1.05/(luminance+0.05);
  return darkContrast>=lightContrast ? dark : '#FFFFFF';
}
function themeColor(name,fallback){
  try{
    if(typeof getComputedStyle==='function'){
      const value=getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      if(value) return value;
    }
  }catch(err){}
  return fallback;
}
function themeBurst(names){
  const fallbacks={'--purple-neon':'#A855F7','--purple-glow':'#C084FC','--blue':'#3B82F6','--green':'#22C55E','--gold':'#FBBF24','--danger':'#F87171'};
  return names.map(function(name){ return themeColor(name,fallbacks[name]||'#A855F7'); });
}
function applyTheme(key){
  const th = THEMES[key] || THEMES.default;
  const rootStyle = document.documentElement.style;
  Object.keys(th.vars).forEach(function(k){ rootStyle.setProperty(k, th.vars[k]); });
  const bg=th.vars['--bg'];
  const secondary=th.vars['--text-secondary'];
  rootStyle.setProperty('--text-muted','color-mix(in srgb,'+secondary+' 68%,'+bg+')');
  rootStyle.setProperty('--border','color-mix(in srgb,'+secondary+' 19%,transparent)');
  rootStyle.setProperty('--on-accent',contrastText(th.vars['--purple-neon']));
  rootStyle.setProperty('--on-success',contrastText(th.vars['--green']));
  rootStyle.setProperty('--on-danger',contrastText(th.vars['--danger']));
  rootStyle.setProperty('--shadow-color',colorLuminance(bg)>0.45?'rgba(15,23,42,0.20)':'rgba(0,0,0,0.70)');
  document.documentElement.dataset.theme = key in THEMES ? key : 'default';
  document.documentElement.dataset.themeMode = colorLuminance(bg)>0.45 ? 'light' : 'dark';
}
function applyWallpaper(key){
  const rootStyle = document.documentElement.style;
  const w = WALLPAPERS.find(function(x){ return x.id===key; });
  if(!w){
    rootStyle.setProperty('--wallpaper-layer','none');
    rootStyle.setProperty('--wallpaper-size','auto');
    rootStyle.setProperty('--wallpaper-position','0 0');
    rootStyle.setProperty('--wallpaper-repeat','repeat');
    document.documentElement.dataset.wallpaper = 'none';
    return;
  }
  rootStyle.setProperty('--wallpaper-layer', w.layer);
  rootStyle.setProperty('--wallpaper-size', w.size);
  rootStyle.setProperty('--wallpaper-position', w.position||'0 0');
  rootStyle.setProperty('--wallpaper-repeat', w.repeat||'repeat');
  document.documentElement.dataset.wallpaper = w.id;
}
function applyEquippedVisuals(){
  if(!state || !state.equipped) return;
  applyTheme(state.equipped.theme);
  applyWallpaper(state.equipped.wallpaper);

/* ---------- Derived-value helpers ---------- */
function getLevel(xp){ return Math.floor(xp/150) + 1; }
function getLevelProgress(xp){ return (xp % 150) / 150; }
function getLevelTitle(level){
  const t = LEVEL_TIERS.find(function(t){ return level>=t.min && level<=t.max; });
  return t ? t.title : 'Lenda Kaizen';
}
function getMascotStage(level){
  const s = MASCOT_STAGES.find(function(s){ return level>=s.min && level<=s.max; });
  return s || MASCOT_STAGES[MASCOT_STAGES.length-1];
}
function mascotProgress(level){
  const s = getMascotStage(level);
  if(s.max===Infinity) return 1;
  const span = s.max - s.min + 1;
  return Math.min(1, (level - s.min + 1) / span);
}
function stageIndexForLevel(level){
  const idx = MASCOT_STAGES.findIndex(function(s){ return level>=s.min && level<=s.max; });
  return idx>=0 ? idx : MASCOT_STAGES.length-1;
}
function getMascotVisual(level, skinKey){
  const idx = stageIndexForLevel(level);
  const skin = MASCOT_SKINS[skinKey] || MASCOT_SKINS.plant;
  return {
    emoji: skin.emojis[idx] || skin.emojis[skin.emojis.length-1],
    name: skin.names[idx] || skin.names[skin.names.length-1]
  };
}
function getKaizenScore(){
  const habitRate = state.habits.length ? state.habits.reduce(function(acc,h){ return acc + h.weekly.filter(Boolean).length/7; },0) / state.habits.length : 0;
  const doneTasks = state.tasks.filter(function(t){ return t.status==='done'; }).length;
  const taskRate = state.tasks.length ? doneTasks/state.tasks.length : 0;
  const goalRate = state.goals.length ? state.goals.reduce(function(a,g){ return a + g.progress/100; },0) / state.goals.length : 0;
  if(state.focusProject && state.focusProject.active){
    const focusData = focusStats();
    const focusRate = Math.min(1,focusData.todayMinutes/Math.max(1,state.focusProject.dailyMinutes));
    return Math.round((habitRate*0.35 + taskRate*0.25 + goalRate*0.20 + focusRate*0.20) * 100);
  }
  return Math.round((habitRate*0.45 + taskRate*0.30 + goalRate*0.25) * 100);
}
function getGreeting(){
  const h = new Date().getHours();
  if(h<12) return 'Bom dia';
  if(h<18) return 'Boa tarde';
  return 'Boa noite';
}
function getMotivationalLine(){
  const d = new Date().getDate();
  return MOTIVATIONAL_LINES[d % MOTIVATIONAL_LINES.length];
}
function weeklySeries(){
  const days = [0,1,2,3,4,5,6];
  return days.map(function(i){
    const total = state.habits.length;
    const done = state.habits.filter(function(h){ return h.weekly[i]; }).length;
    return total ? Math.round((done/total)*100) : 0;
  });
}
function getAchievements(){
  const level = getLevel(state.xp);
  const doneTasks = state.tasks.filter(function(t){ return t.status==='done'; }).length;
  const readingHabit = state.habits.find(function(h){ return h.name==='Leitura'; });

/* ---------- UI-building helpers ---------- */
function scoreRing(score, size){
  size = size || 'big';
  const r = size==='big' ? 52 : 36;
  const circ = 2*Math.PI*r;
  const clamped = Math.max(0, Math.min(100, score));
  const off = circ * (1 - clamped/100);
  const vb = size==='big' ? 120 : 88;
  const color = clamped>=90 ? 'var(--purple-neon)' : clamped>=75 ? 'var(--green)' : clamped>=50 ? 'var(--gold)' : 'var(--danger)';
  return '<svg viewBox="0 0 ' + vb + ' ' + vb + '" class="score-ring ' + size + '">' +
    '<circle cx="' + (vb/2) + '" cy="' + (vb/2) + '" r="' + r + '" class="ring-track"/>' +
    '<circle cx="' + (vb/2) + '" cy="' + (vb/2) + '" r="' + r + '" class="ring-fill" style="stroke:' + color + '; --circ:' + circ + 'px; --off:' + off + 'px; stroke-dasharray:' + circ + 'px;"/>' +
    '</svg>';
}
function areaChart(dataArr, labels, colorFrom, colorTo, gradId){
  const w=560, h=180, pad=26;
  const max = Math.max.apply(null, dataArr.concat([10]));
  const stepX = (w-pad*2) / (dataArr.length-1);
  const pts = dataArr.map(function(v,i){
    const x = pad + i*stepX;
    const y = (h-pad) - (v/max) * (h-pad*2);
    return [x,y];
  });
  const linePath = pts.map(function(p,i){ return (i===0?'M':'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
  const areaPath = linePath + ' L' + pts[pts.length-1][0].toFixed(1) + ',' + (h-pad) + ' L' + pts[0][0].toFixed(1) + ',' + (h-pad) + ' Z';
  const gridLines = [0,1,2,3].map(function(i){
    const y = pad + i*((h-pad*2)/3);
    return '<line x1="' + pad + '" y1="' + y + '" x2="' + (w-pad) + '" y2="' + y + '" class="chart-grid"/>';
  }).join('');
  const labelEls = labels.map(function(l,i){
    const x = pad + i*stepX;
    return '<text x="' + x + '" y="' + (h-6) + '" class="chart-label" text-anchor="middle">' + esc(l) + '</text>';
  }).join('');
  const dots = pts.map(function(p){ return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3.5" class="chart-dot"/>'; }).join('');
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" class="area-chart">' +
    '<defs>' +
      '<linearGradient id="' + gradId + '" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="' + colorTo + '" stop-opacity="0.45"/>' +
        '<stop offset="100%" stop-color="' + colorTo + '" stop-opacity="0"/>' +
      '</linearGradient>' +
      '<linearGradient id="' + gradId + '-line" x1="0" y1="0" x2="1" y2="0">' +
        '<stop offset="0%" stop-color="' + colorFrom + '"/>' +
        '<stop offset="100%" stop-color="' + colorTo + '"/>' +
      '</linearGradient>' +
    '</defs>' +
    gridLines +
    '<path d="' + areaPath + '" fill="url(#' + gradId + ')" stroke="none"/>' +
    '<path d="' + linePath + '" fill="none" stroke="url(#' + gradId + '-line)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" class="chart-line"/>' +
    dots + labelEls +
    '</svg>';
}
function mascotOrb(level, size, skinKey){
  size = size || 96;
  const v = getMascotVisual(level, skinKey);
  const pct = Math.round(mascotProgress(level)*100);
  return '<div class="mascot-widget">' +
    '<div class="mascot-orb" style="--size:' + size + 'px;">' +
      '<div class="mascot-glow"></div>' +
      '<span class="mascot-emoji" style="font-size:' + Math.round(size*0.42) + 'px;">' + v.emoji + '</span>' +
    '</div>' +
    '<div class="mascot-name">' + esc(v.name) + '</div>' +
    '<div class="progress-track thin mascot-bar"><div class="progress-fill" style="--w:' + pct + '%; background:linear-gradient(90deg,var(--green),var(--purple-neon));"></div></div>' +
    '<span class="mascot-caption muted tiny">' + pct + '% para a próxima evolução</span>' +
    '</div>';
}

function formatFocusTime(seconds){
  const safe = Math.max(0,Math.floor(Number(seconds)||0));
  const minutes = Math.floor(safe/60);
  const secs = safe%60;
  return String(minutes).padStart(2,'0') + ':' + String(secs).padStart(2,'0');
}

let focusTicker = null;
function scheduleFocusTicker(){
  if(focusTicker){ clearInterval(focusTicker); focusTicker=null; }
  if(!state || !state.focusProject || !state.focusProject.timer.running) return;
  focusTicker = setInterval(function(){
    if(!state || !state.focusProject || !state.focusProject.timer.running){ clearInterval(focusTicker); focusTicker=null; return; }
    const remaining = focusTimerRemaining();
    const textEl = document.getElementById('focusTimerText');
    const dialEl = document.getElementById('focusTimerDial');
    const finishEl = document.querySelector('[data-action="finish-focus-session"]');
    if(textEl) textEl.textContent = formatFocusTime(remaining);
    if(dialEl){
      const duration = Math.max(1,Number(state.focusProject.timer.duration)||1);
      dialEl.style.setProperty('--timer-pct',Math.min(100,Math.round((duration-remaining)/duration*100))+'%');
      if(finishEl) finishEl.disabled=(duration-remaining)<300;
    }
    if(remaining<=0){
      clearInterval(focusTicker); focusTicker=null;
      completeFocusSession(true);
    }
  },1000);
}
function completeFocusSession(naturalEnd){
  const p = state.focusProject;
  const timer = p.timer;
  const remaining = naturalEnd ? 0 : focusTimerRemaining();
  const minutes = Math.max(0,Math.round((Math.max(0,timer.duration-remaining))/60));
  timer.running = false;
  timer.startedAt = null;
  timer.sessionStartedAt = null;
  if(minutes<5){
    timer.remaining = timer.duration;
    renderApp();
    toast('Complete pelo menos 5 minutos para registrar a sessão.','error');
    return;
  }
  p.sessions.push({id:'fs'+Date.now(),date:localDateISO(),minutes:minutes,completedAt:Date.now(),mode:p.mode});
  if(p.sessions.length>500) p.sessions = p.sessions.slice(-500);
  let gainedXp = Math.min(60,Math.max(10,Math.round(minutes/5)*5));
  let gainedCoins = Math.min(30,Math.max(5,Math.round(minutes/10)*3));
  if(state.xpBoostCharges>0){ gainedXp*=2; state.xpBoostCharges-=1; }
  if(state.coinBoostCharges>0){ gainedCoins*=2; state.coinBoostCharges-=1; }
  state.xp += gainedXp;
  state.coins += gainedCoins;
  timer.duration = (Number(p.cycleMinutes)||50)*60;
  timer.remaining = timer.duration;
  p.ritual = {phone:false,notifications:false,materials:false,water:false};
  renderApp();
  toast('Sessão de '+minutes+' min concluída. Faça '+p.breakMinutes+' min de pausa.','success');
  const btn = document.querySelector('[data-action="start-focus-timer"]');
  if(btn){ const rect=btn.getBoundingClientRect(); burst(rect.left+rect.width/2,rect.top+rect.height/2,themeBurst(['--purple-neon','--green','--blue'])); }
}

/* ---------- Loja Kaizen ---------- */
function unlockCard(slot, itemId, ownedKey, visualHTML, name, desc, price, rarity){
  const owned = state.owned.has(ownedKey);
  const equipped = state.equipped[slot] === itemId;
  const afford = state.coins >= price;
  let btn;
  if(equipped){
    btn = `<button class="btn shop-buy-btn owned" disabled>${icon('check','')} Equipado</button>`;
  } else if(owned){
    btn = `<button class="btn shop-buy-btn" data-action="equip-item" data-slot="${slot}" data-id="${itemId}">Equipar</button>`;
  } else if(afford){
    btn = `<button class="btn shop-buy-btn" data-action="buy-unlock" data-slot="${slot}" data-owned-key="${ownedKey}" data-equip-id="${itemId}" data-price="${price}">${icon('gem','')} ${price}</button>`;
  } else {
    btn = `<button class="btn shop-buy-btn" disabled>Coins insuficientes</button>`;
  }
  return `<div class="shop-card rarity-${rarity}">
    ${visualHTML}
    <h4>${esc(name)}</h4>
    <p class="shop-desc">${esc(desc)}</p>
    <span class="rarity-tag rarity-${rarity}">${rarityLabel(rarity)}</span>
    ${btn}
  </div>`;
}
function themeCard(key){
  const th = THEMES[key];
  const swatch = `<div class="theme-swatch-preview">${['--bg','--card-premium','--purple-neon','--blue','--gold'].map(function(v){ return `<span class="swatch-dot" style="background:${th.vars[v]}"></span>`; }).join('')}</div>`;
  return unlockCard('theme', key, 'theme_'+key, swatch, th.name, th.desc, th.price, th.rarity);
}
function avatarCard(a){
  return unlockCard('avatar', a.id, a.id, `<div class="shop-icon">${a.emoji}</div>`, a.name, a.desc, a.price, a.rarity);
}
function frameCard(f){

/* ---------- Configurações ---------- */
function notificationDeviceCardHTML(){
  const permission=browserNotificationPermission();
  const info=session.notificationState||{};
  const devices=Array.isArray(info.devices)?info.devices:[];
  const enabled=devices.length>0 && permission==='granted';
  const native=window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();
  const providerReady=native?info.native_push_enabled:info.web_push_enabled;
  let title='Ativar neste dispositivo';
  let description='O Kaizen só envia lembretes depois que você autorizar a permissão.';
  if(!session.accessToken){ description='Entre usando o backend para sincronizar e registrar este dispositivo.'; }
  else if(info.error){ description=info.error; }
  else if(permission==='denied'){ title='Permissão bloqueada'; description='Libere as notificações nas configurações do navegador ou do aparelho.'; }
  else if(enabled){ title='Notificações ativas'; description=devices.length+' dispositivo(s) conectado(s) à sua conta.'; }
  else if(providerReady===false){ description='O aplicativo está pronto, mas as chaves do provedor deste dispositivo ainda precisam ser configuradas no servidor.'; }
  return `<div class="notification-device-card">
    <div class="notification-device-copy">${icon('bell','')}<div><strong>${esc(title)}</strong><p class="notification-state">${esc(description)}</p></div></div>
    <div class="notification-device-actions">
      ${enabled?`<button class="btn ghost small" data-action="test-notification">Testar</button><button class="btn danger-ghost small" data-action="disable-notifications">Desativar</button>`:`<button class="btn primary small" data-action="enable-notifications" ${!session.accessToken||session.notificationLoading?'disabled':''}>${session.notificationLoading?'Verificando...':'Permitir notificações'}</button>`}
    </div>
  </div>`;
}
function syncStatusCardHTML(){
  const pending=session.syncPending||0;
  const conflicts=session.syncConflicts||0;
  const online=navigator.onLine!==false;
  let title=pending?'Sincronização pendente':'Dados sincronizados';
  let description=pending
    ? pending+' alteração(ões) protegida(s) neste aparelho. '+(online?'Você pode tentar enviar agora.':'O envio começa automaticamente ao voltar a internet.')
    : 'Nenhuma alteração deste aparelho está esperando envio.';
  if(conflicts){
    title='Conflito entre dispositivos';
    description=conflicts+' alteração(ões) precisam de revisão. Você pode restaurar somente essas alterações com os dados do servidor.';
  }
  if(session.syncMessage) description=session.syncMessage;
  return `<div class="notification-device-card">

/* ---------- Effects: confetti + toast ---------- */
function burst(x, y, colors){
  const overlay = document.getElementById('particles-overlay');
  if(!overlay) return;
  for(let i=0;i<16;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = Math.random()*Math.PI*2;
    const dist = 55 + Math.random()*85;
    p.style.setProperty('--tx', Math.cos(angle)*dist + 'px');
    p.style.setProperty('--ty', Math.sin(angle)*dist + 'px');
    p.style.setProperty('--r', (Math.random()*360) + 'deg');
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.background = colors[i % colors.length];
    overlay.appendChild(p);
    setTimeout(function(){ p.remove(); }, 900);
  }
}
function burstFromEvent(e, colors){
  burst(e.clientX, e.clientY, colors);
}
function toast(msg, type){
  const root = document.getElementById('toast-root');
  if(!root) return;
  const el = document.createElement('div');
  el.className = 'toast toast-' + (type||'info');
  el.textContent = msg;
  root.appendChild(el);
  requestAnimationFrame(function(){ el.classList.add('show'); });
  setTimeout(function(){
    el.classList.remove('show');
    setTimeout(function(){ el.remove(); }, 300);
  }, 2600);
}

/* ---------- Coach Kaizen — real Claude API calls ---------- */
function buildWeeklyContext(){
  const lines = [];
  lines.push('Hábitos (dias concluídos na semana / 7):');
  state.habits.forEach(function(h){
    const count = h.weekly.filter(Boolean).length;
    lines.push('- ' + h.name + ': ' + count + '/7 dias, sequência atual de ' + h.streak + ' dias');
  });
  const done = state.tasks.filter(function(t){ return t.status==='done'; }).length;
  const overdue = state.tasks.filter(function(t){ return t.overdue && t.status!=='done'; }).length;
  lines.push('Tarefas: ' + done + '/' + state.tasks.length + ' concluídas, ' + overdue + ' atrasadas');
  lines.push('Sequência geral (streak): ' + state.streak + ' dias');
  lines.push('Kaizen Score atual: ' + getKaizenScore() + '/100');
  return lines.join('\n');
}

async function askCoach(){

      'DADOS DO USUÁRIO NESTA SEMANA:\n' + ctx + '\n\n' +

      'Responda EXCLUSIVAMENTE com um objeto JSON válido (sem markdown, sem crases, sem texto fora do JSON), no formato exato:\n' +
      '{"leitura_emocional":"...","pontos_fortes":["...","..."],"pontos_fracos":["...","..."],"sugestao_kaizen":"...","melhoria_1_porcento":"..."}\n\n' +

/* ---------- Event delegation ---------- */
document.addEventListener('click', async function(e){
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;

  switch(action){
    case 'nav': {
      state.currentPage = t.dataset.page;
      session.mobileMenuOpen = false;
      session.confirmEntityDelete = null;
      renderApp();
      window.scrollTo(0,0);
      break;
    }
    case 'help-opt-in': {
      state.helpGuide.decided=true;
      state.helpGuide.enabled=t.dataset.enabled==='true';
      state.helpGuide.seenPages=[];
      renderApp();
      toast(state.helpGuide.enabled?'Dicas guiadas ativadas.':'Dicas desativadas. Você pode ativá-las nas Configurações.','success');
      break;
    }
    case 'help-dismiss': {
      if(!state.helpGuide.seenPages.includes(state.currentPage)) state.helpGuide.seenPages.push(state.currentPage);
      renderApp();
      break;
    }
    case 'help-next': {
      const index=NAV_ITEMS.findIndex(function(item){return item.page===state.currentPage;});
      if(!state.helpGuide.seenPages.includes(state.currentPage)) state.helpGuide.seenPages.push(state.currentPage);
      if(index>=0 && index<NAV_ITEMS.length-1){
        state.currentPage=NAV_ITEMS[index+1].page;
        session.mobileMenuOpen=false;
        renderApp();
        window.scrollTo(0,0);
      } else {
        state.helpGuide.enabled=false;
        renderApp();
        toast('Guia concluído. Você pode reiniciá-lo nas Configurações.','success');
      }
      break;
    }
    case 'help-disable': {
      state.helpGuide.enabled=false;
      renderApp();
      toast('Dicas desativadas.','success');
      break;
    }
    case 'toggle-mobile-menu': {
      session.mobileMenuOpen = !session.mobileMenuOpen;
      renderApp();
      if(session.mobileMenuOpen){
        setTimeout(function(){
          const activeLink=document.querySelector('.mobile-nav-link.active') || document.querySelector('.mobile-nav-link');
          if(activeLink && activeLink.focus) activeLink.focus();
        },0);
      }
      break;
    }
    case 'close-mobile-menu': {
      session.mobileMenuOpen = false;
      renderApp();
      break;
    }
    case 'ask-delete-entity': {
      const type = t.dataset.entity;
      if(!['focus','habit','goal','task'].includes(type)) return;
      session.confirmEntityDelete = {type:type,id:t.dataset.id||''};
      renderApp();
      break;
    }
    case 'cancel-delete-entity': {
      session.confirmEntityDelete = null;
      renderApp();
      break;
    }
    case 'confirm-delete-entity': {
      const type = t.dataset.entity;
      const id = t.dataset.id||'';
      if(!isEntityDeletePending(type,id)) return;
      if(type==='focus'){
        if(session.accessToken && state.focusProject.serverId){
          try{
            const query=state.focusProject.serverVersion?'?version='+encodeURIComponent(state.focusProject.serverVersion):'';
            await apiMutation('/focuses/'+state.focusProject.serverId+query,{method:'DELETE'},{entityType:'focus',entityId:state.focusProject.serverId});
          }catch(error){ toast('Não foi possível excluir o foco no servidor: '+error.message,'error'); return; }
        }
        if(focusTicker){ clearInterval(focusTicker); focusTicker=null; }
        state.focusProject = createDefaultFocusProject(false);
        session.confirmEntityDelete = null;
        renderApp();
        window.scrollTo(0,0);
        toast('Projeto encerrado. Você já pode criar um novo foco.','success');
        break;
      }
      const collectionByType = {habit:'habits',goal:'goals',task:'tasks'};
      const labelByType = {habit:'Hábito excluído.',goal:'Meta excluída.',task:'Tarefa excluída.'};
      const collectionKey = collectionByType[type];
      if(!collectionKey) return;
      const deletingItem=state[collectionKey].find(function(item){return item.id===id;});
      if(session.accessToken && deletingItem){
        try{ await deleteBackendEntity(type,deletingItem); }
        catch(error){ toast('Não foi possível excluir no servidor: '+error.message,'error'); return; }
      }
      const before = state[collectionKey].length;
      state[collectionKey] = state[collectionKey].filter(function(item){ return item.id!==id; });
      if(state.editingScheduleId===id){
        state.editingScheduleId = null;
        state.editingScheduleType = null;
      }
      session.confirmEntityDelete = null;
      renderApp();
      if(state[collectionKey].length<before) toast(labelByType[type],'success');
      break;
    }
    case 'focus-mode': {
      state.focusProject.mode = t.dataset.mode==='intense' ? 'intense' : 'sustainable';
      if(document.querySelectorAll){
        document.querySelectorAll('.mode-option').forEach(function(btn){ btn.classList.toggle('active',btn.dataset.mode===state.focusProject.mode); });
      }
      break;
    }
    case 'save-focus-project': {
      const p = state.focusProject;
      const nameEl = document.getElementById('focusNameInput');
      const identityEl = document.getElementById('focusIdentityInput');
      const whyEl = document.getElementById('focusWhyInput');
      const outcomeEl = document.getElementById('focusOutcomeInput');
      const name = nameEl ? nameEl.value.trim() : '';
      const identity = identityEl ? identityEl.value.trim() : '';
      const outcome = outcomeEl ? outcomeEl.value.trim() : '';
      if(!name || !identity || !outcome){ toast('Preencha projeto, identidade e resultado concreto.','error'); return; }
      const wasActive = p.active;
      p.name = name;
      p.identity = identity;
      p.why = whyEl ? whyEl.value.trim() : '';
      p.outcome = outcome;
      p.dailyMinutes = Math.max(10,Math.min(360,parseInt((document.getElementById('focusDailyInput')||{}).value,10)||60));
      p.cycleMinutes = Math.max(10,Math.min(90,parseInt((document.getElementById('focusCycleInput')||{}).value,10)||50));
      p.breakMinutes = Math.max(5,Math.min(30,parseInt((document.getElementById('focusBreakInput')||{}).value,10)||10));
      p.targetDays = Math.max(30,Math.min(365,parseInt((document.getElementById('focusDaysInput')||{}).value,10)||90));
      p.nextAction = ((document.getElementById('focusNextInput')||{}).value||'').trim();
      p.curiosityQuestion = ((document.getElementById('focusQuestionInput')||{}).value||'').trim();
      p.startedAt = wasActive ? p.startedAt : localDateISO();
      p.active = true;
      p.editing = false;
      session.confirmEntityDelete = null;
      delete p.editingOriginalMode;
      if(!p.timer.running){ p.timer.duration=p.cycleMinutes*60; p.timer.remaining=p.timer.duration; }
      const earnedActivationReward = !wasActive && !state.focusActivationRewardClaimed;
      if(earnedActivationReward){
        state.xp+=20;
        state.coins+=10;
        state.focusActivationRewardClaimed=true;
      }
      if(session.accessToken){
        try{ await syncFocusBackend(); }
        catch(error){ toast('Projeto salvo no aparelho, mas não sincronizou: '+error.message,'error'); }
      }
      renderApp();
      toast(wasActive?'Projeto Central atualizado.':(earnedActivationReward?'Projeto Central ativado! +20 XP':'Novo Projeto Central ativado.'),'success');
      break;
    }
    case 'edit-focus-project': {
      if(state.focusProject.timer.running){ toast('Pause a sessão antes de editar o plano.','error'); return; }
      state.focusProject.editingOriginalMode = state.focusProject.mode;
      state.focusProject.editing = true;
      renderApp();
      window.scrollTo(0,0);
      break;
    }
    case 'cancel-focus-edit': {
      if(state.focusProject.editingOriginalMode) state.focusProject.mode=state.focusProject.editingOriginalMode;
      delete state.focusProject.editingOriginalMode;
      state.focusProject.editing = false;
      renderApp();
      break;
    }
    case 'toggle-focus-ritual': {
      const key = t.dataset.key;
      if(Object.prototype.hasOwnProperty.call(state.focusProject.ritual,key)) state.focusProject.ritual[key]=!state.focusProject.ritual[key];
      renderApp();
      queueFocusBackendSync();
      break;
    }
    case 'save-focus-health': {
      const p = state.focusProject;
      p.health = {
        date:localDateISO(),
        sleep:parseFloat((document.getElementById('focusSleepInput')||{}).value)||0,
        energy:parseInt((document.getElementById('focusEnergyInput')||{}).value,10)||1,
        stress:parseInt((document.getElementById('focusStressInput')||{}).value,10)||1,
        meals:!!(document.getElementById('focusMealsInput')||{}).checked,
        movement:!!(document.getElementById('focusMovementInput')||{}).checked,
        recovery:!!(document.getElementById('focusRecoveryInput')||{}).checked
      };
      renderApp();
      const result=focusHealthScore();
      queueFocusBackendSync();
      toast(result.critical?'Check-in salvo: hoje a prioridade é recuperar.':'Check-in salvo. Capacidade atualizada.',result.critical?'error':'success');
      break;
    }
    case 'set-focus-preset': {
      const p=state.focusProject;
      if(p.timer.running) return;
      const minutes=Math.max(10,Math.min(90,parseInt(t.dataset.minutes,10)||p.cycleMinutes));
      p.cycleMinutes=minutes;
      p.timer.duration=minutes*60;
      p.timer.remaining=p.timer.duration;
      p.timer.startedAt=null;
      renderApp();
      break;
    }
    case 'start-focus-timer': {
      const p=state.focusProject;
      const capacity=focusHealthScore();
      if(p.mode==='intense' && (capacity.score===null || capacity.critical)){
        toast(capacity.score===null?'Faça o check-in antes da imersão intensa.':'Imersão bloqueada: recupere sua capacidade primeiro.','error');
        return;
      }
      const prepared=Object.keys(p.ritual).filter(function(k){return p.ritual[k];}).length;
      if(prepared<2) toast('Dica: complete pelo menos dois itens do ritual de entrada.','error');
      if(focusTimerRemaining()<=0){ p.timer.remaining=p.timer.duration; }
      p.timer.running=true;
      p.timer.startedAt=Date.now();
      if(!p.timer.sessionStartedAt) p.timer.sessionStartedAt=Date.now();
      renderApp();
      break;
    }
    case 'pause-focus-timer': {
      const timer=state.focusProject.timer;
      timer.remaining=focusTimerRemaining();
      timer.running=false;
      timer.startedAt=null;
      renderApp();
      toast('Sessão pausada. O progresso foi preservado.','success');
      break;
    }
    case 'reset-focus-timer': {
      const p=state.focusProject;
      p.timer.running=false;
      p.timer.startedAt=null;
      p.timer.sessionStartedAt=null;
      p.timer.duration=(Number(p.cycleMinutes)||50)*60;
      p.timer.remaining=p.timer.duration;
      renderApp();
      break;
    }
    case 'finish-focus-session': {
      completeFocusSession(false);
      queueFocusBackendSync();
      break;
    }
    case 'add-focus-milestone': {
      const input=document.getElementById('newFocusMilestoneInput');
      if(!input || !input.value.trim()) return;
      state.focusProject.milestones.push({id:'fm'+Date.now(),title:input.value.trim(),done:false});
      renderApp();
      queueFocusBackendSync();
      toast('Marco adicionado.','success');
      break;
    }
    case 'toggle-focus-milestone': {
      const m=state.focusProject.milestones.find(function(x){return x.id===t.dataset.id;});
      if(!m) return;
      const wasDone=m.done;
      m.done=!m.done;
      if(m.done && !wasDone){ state.xp+=25; state.coins+=15; burstFromEvent(e,themeBurst(['--green','--purple-neon','--gold'])); toast('Marco concluído! +25 XP','success'); }
      else if(wasDone){ state.xp=Math.max(0,state.xp-25); state.coins=Math.max(0,state.coins-15); }
      renderApp();
      queueFocusBackendSync();
      break;
    }
    case 'delete-focus-milestone': {
      state.focusProject.milestones=state.focusProject.milestones.filter(function(x){return x.id!==t.dataset.id;});
      renderApp();
      queueFocusBackendSync();
      break;
    }
    case 'toggle-habit': {
      const h = state.habits.find(function(x){ return x.id===t.dataset.id; });
      if(!h) return;
      const todayIdx = getTodayIndex();
      const isDone = h.weekly[todayIdx]===1;
      if(isDone){
        h.weekly[todayIdx]=0;
        if(state.dayOffCharges>0){
          state.dayOffCharges -= 1;
          toast('Dia de Folga usado — sua sequência foi protegida!','success');
        } else {
          h.streak = Math.max(0, h.streak-1);
          state.xp = Math.max(0, state.xp - (h.xp||10));
          state.coins = Math.max(0, state.coins - 5);
        }
      } else {
        h.weekly[todayIdx]=1;
        h.streak += 1;
        let gainedXp = h.xp||10;
        let gainedCoins = 5;
        if(state.xpBoostCharges>0){ gainedXp *= 2; state.xpBoostCharges -= 1; }
        if(state.coinBoostCharges>0){ gainedCoins *= 2; state.coinBoostCharges -= 1; }
        state.xp += gainedXp;
        state.coins += gainedCoins;
        burstFromEvent(e, themeBurst(['--green','--blue','--gold']));
      }
      if(session.accessToken){
        const endpoint='/habits/'+h.id+'/completions/'+localDateISO();
        try{
          const result=await apiMutation(endpoint,{method:isDone?'DELETE':'PUT'},{entityType:'habit-completion',entityId:h.id+'-'+localDateISO()});

    }
    case 'auth-register-email': {
      const name=String((document.getElementById('authRegisterName')||{}).value||'').trim();
      const email=normalizeEmail((document.getElementById('authRegisterEmail')||{}).value);
      const password=String((document.getElementById('authRegisterPassword')||{}).value||'');
      const confirmation=String((document.getElementById('authRegisterConfirm')||{}).value||'');
      if(name.length<2){ showAuthFailure('Informe um nome com pelo menos 2 caracteres.'); return; }
      if(!isValidEmail(email)){ showAuthFailure('Informe um e-mail válido.'); return; }
      if(backendEnabled()){
        if(!passwordStrength(password).valid){ showAuthFailure('Sua senha ainda não atende a todos os requisitos.'); return; }
        if(password!==confirmation){ showAuthFailure('A confirmação da senha não confere.'); return; }
        session.authBusy=true; session.authError=''; renderApp(); clearBackendAuth();
        try{
          const result=await apiRequest('/auth/register',{method:'POST',body:{name:name,email:email,password:password}},false);
          await enterBackendAccount(result); toast('Conta criada com segurança no backend.','success');
        }catch(error){ showAuthFailure(error.message); }
        return;
      }
      if(findAccountByEmail(email)){ showAuthFailure('Já existe uma conta com este e-mail neste dispositivo.'); return; }
      if(!passwordStrength(password).valid){ showAuthFailure('Sua senha ainda não atende a todos os requisitos.'); return; }
      if(password!==confirmation){ showAuthFailure('A confirmação da senha não confere.'); return; }
      session.authBusy=true; session.authError=''; renderApp();
      try{
        const salt=createPasswordSalt();
        const passwordHash=await hashPassword(password,salt);
        await createAuthenticatedAccount(name,{method:'email',email:email,passwordSalt:salt,passwordHash:passwordHash,passwordAlgorithm:'PBKDF2-SHA256',passwordIterations:120000,verified:true,createdAt:Date.now()});
        toast('Conta criada com sucesso.','success');
      } catch(err){ showAuthFailure('Não foi possível criar a conta neste navegador.'); }
      break;
    }
    case 'auth-google-continue': {
      if(backendEnabled()){
        session.authBusy=true; session.authError=''; session.authNotice='Abrindo a tela segura do Google...'; renderApp();
        try{ await startGoogleOAuth(); }
        catch(error){ showAuthFailure(error.message); }
        return;
      }
      const name=String((document.getElementById('authGoogleName')||{}).value||'').trim();
      const email=normalizeEmail((document.getElementById('authGoogleEmail')||{}).value);
      if(!isValidEmail(email)){ showAuthFailure('Informe um e-mail Google válido.'); return; }
      const existing=findAccountByEmail(email);
      if(existing){
        if(!existing.auth || existing.auth.method!=='google'){ showAuthFailure('Este e-mail já usa '+authProviderLabel(existing.auth)+'. Entre pelo método correto.'); return; }
        try{ await enterAccount(existing.id); toast('Conta Google conectada.','success'); }
        catch(err){ showAuthFailure('Não foi possível abrir esta conta.'); }
        return;
      }
      if(name.length<2){ showAuthFailure('Informe o nome exibido na sua conta Google.'); return; }
      try{
        await createAuthenticatedAccount(name,{method:'google',email:email,verified:true,prototype:true,createdAt:Date.now()});
        toast('Conta Google adicionada ao protótipo.','success');
      } catch(err){ showAuthFailure('Não foi possível conectar esta conta.'); }
      break;
    }
    case 'auth-phone-send': {
      const name=String((document.getElementById('authPhoneName')||{}).value||'').trim();
      const phone=normalizePhone((document.getElementById('authPhoneNumber')||{}).value);
      if(!isValidPhone(phone)){ showAuthFailure('Informe um celular válido com DDD.'); return; }
      if(backendEnabled()){
        session.authBusy=true; session.authError=''; renderApp();
        try{
          const result=await apiRequest('/auth/phone/request',{method:'POST',body:{phone:phone,name:name||null}},false);
          session.pendingAuth={method:'phone',phone:phone,name:name,backend:true};
          session.authBusy=false; session.authNotice=result.message; renderApp();
        }catch(error){ showAuthFailure(error.message); }
        return;
      }
      if(!findAccountByPhone(phone) && name.length<2){ showAuthFailure('Para uma conta nova, informe também seu nome.'); return; }
      session.pendingAuth={method:'phone',phone:phone,name:name,code:'123456'};
      session.authNotice='Código preparado para verificação.';
      session.authError='';
      renderApp();
      break;
    }
    case 'auth-phone-restart': {
      session.pendingAuth=null;
      clearAuthFeedback();
      renderApp();
      break;
    }
    case 'auth-phone-verify': {
      const pending=session.pendingAuth;
      const code=String((document.getElementById('authPhoneCode')||{}).value||'').replace(/\D/g,'');
      if(!pending || pending.method!=='phone'){ session.authScreen='phone'; renderApp(); return; }
      if(pending.backend){
        if(code.length!==6){ showAuthFailure('Digite o código de seis dígitos.'); return; }
        session.authBusy=true; session.authError=''; renderApp();
        try{
          const result=await apiRequest('/auth/phone/verify',{method:'POST',body:{phone:pending.phone,code:code}},false);
          await enterBackendAccount(result); toast('Telefone verificado.','success');
        }catch(error){ showAuthFailure(error.message); }
        return;
      }
      if(code!==pending.code){ showAuthFailure('Código incorreto. Na prévia, use 123456.'); return; }
      const existing=findAccountByPhone(pending.phone);
      try{
        if(existing) await enterAccount(existing.id);
        else await createAuthenticatedAccount(pending.name,{method:'phone',phone:pending.phone,verified:true,prototype:true,createdAt:Date.now()});
        toast(existing?'Telefone verificado.':'Conta criada e telefone verificado.','success');
      } catch(err){ showAuthFailure('Não foi possível concluir a verificação.'); }
      break;
    }
    case 'auth-use-legacy': {
      const account=getAccountEntry(t.dataset.id);
      if(!account || account.auth){ showAuthFailure('Esta conta exige autenticação.'); return; }
      try{
        await enterAccount(account.id);
        toast('Conta antiga aberta. Proteja o acesso no menu da conta.','success');
      } catch(err){ showAuthFailure('Não foi possível abrir esta conta.'); }
      break;
    }
    case 'auth-save-security': {
      const account=getAccountEntry(session.activeId);
      if(!account){ showAuthFailure('Conta ativa não encontrada.'); return; }
      const updating=account.auth && account.auth.method==='email';
      const email=updating ? account.auth.email : normalizeEmail((document.getElementById('authSecurityEmail')||{}).value);
      const currentPassword=String((document.getElementById('authCurrentPassword')||{}).value||'');
      const password=String((document.getElementById('authSecurityPassword')||{}).value||'');
      const confirmation=String((document.getElementById('authSecurityConfirm')||{}).value||'');
      if(!isValidEmail(email)){ showAuthFailure('Informe um e-mail válido.'); return; }
      const duplicate=findAccountByEmail(email);
      if(duplicate && duplicate.id!==account.id){ showAuthFailure('Este e-mail já pertence a outra conta neste dispositivo.'); return; }
      if(!passwordStrength(password).valid){ showAuthFailure('A nova senha ainda não atende a todos os requisitos.'); return; }
      if(password!==confirmation){ showAuthFailure('A confirmação da senha não confere.'); return; }
      session.authBusy=true; session.authError=''; renderApp();
      try{
        if(updating){
          const currentHash=await hashPassword(currentPassword,account.auth.passwordSalt);
          if(currentHash!==account.auth.passwordHash){ showAuthFailure('A senha atual está incorreta.'); return; }
        }
        const salt=createPasswordSalt();
        const passwordHash=await hashPassword(password,salt);
        account.auth={method:'email',email:email,passwordSalt:salt,passwordHash:passwordHash,passwordAlgorithm:'PBKDF2-SHA256',passwordIterations:120000,verified:true,createdAt:(account.auth&&account.auth.createdAt)||Date.now(),updatedAt:Date.now()};
        await saveProfileIndex();
        clearAuthFeedback(); session.authReturn=null; session.view='app'; renderApp();
        toast(updating?'Senha atualizada.':'Conta protegida com e-mail e senha.','success');
      } catch(err){ showAuthFailure('Não foi possível atualizar a segurança da conta.'); }
      break;
    }
    case 'manage-account-security': {
      session.authReturn='app';
      session.authScreen='security';
      session.view='picker';
      clearAuthFeedback();
      renderApp();
      break;
    }
    case 'add-account': {
      persistCurrentProfile();
      session.authReturn='app';
      session.authScreen='register';
      session.view='picker';
      clearAuthFeedback();
      renderApp();
      break;
    }
    case 'logout':
    case 'switch-account': {
      persistCurrentProfile();
      if(session.accessToken){
        try{ await disableDeviceNotifications(); }catch(error){ console.warn('Falha ao remover dispositivo:',error); }
        try{ await apiRequest('/auth/logout',{method:'POST'},false); }catch(error){ console.warn('Falha ao encerrar sessão remota:',error); }
        clearBackendAuth();
      }
      await saveSession(null);
      state=null;
      session.activeId=null;
      session.creatingProfile=false;
      session.confirmDeleteId=null;
      session.mobileMenuOpen=false;
      session.authReturn=null;
      session.authScreen='login';
      session.pendingAuth=null;
      session.syncPending=0;
      session.syncConflicts=0;
      session.syncMessage='';
      clearAuthFeedback();
      session.view='picker';
      renderApp();
      break;
    }
    case 'show-create-profile': {
      session.authScreen='register';
      session.view='picker';
      clearAuthFeedback();
      renderApp();
      break;
    }
    case 'cancel-create-profile': {
      session.authScreen='login';
      session.view='picker';
      clearAuthFeedback();
      renderApp();
      break;
    }
    case 'confirm-create-profile': {
      session.authScreen='register';
      session.view='picker';
      clearAuthFeedback();
      renderApp();
      break;
    }
    case 'enter-profile': {
      const account=getAccountEntry(t.dataset.id);
      if(account && account.auth){ session.authScreen='login'; session.view='picker'; showAuthFailure('Entre usando '+authProviderLabel(account.auth)+'.'); return; }
      try{ await enterAccount(t.dataset.id); }
      catch(err){ session.view='picker'; showAuthFailure('Não foi possível abrir esta conta.'); }
      break;
    }
    case 'ask-delete-profile': {
      session.confirmDeleteId = t.dataset.id;
      renderApp();
      break;
    }
    case 'cancel-delete-profile': {
      session.confirmDeleteId = null;
      renderApp();
      break;
    }
    case 'confirm-delete-profile': {
      const delId = t.dataset.id;
      deleteProfileById(delId).then(function(){
        session.confirmDeleteId = null;
        renderApp();
        toast('Perfil excluído','success');
      }).catch(function(){
        session.confirmDeleteId = null;
        renderApp();
      });
      break;
    }
    default: break;
  }
});

document.addEventListener('keydown', function(e){
  if(e.key==='Escape' && session.mobileMenuOpen){
    session.mobileMenuOpen=false;
    renderApp();
    return;
  }
  if(e.key==='Enter'){
    const el = e.target.closest('[data-enter-action]');
    if(el){
      e.preventDefault();
      const btn = document.querySelector('[data-action="' + el.dataset.enterAction + '"]');
      if(btn) btn.click();
    }
  }
});

document.addEventListener('input', function(e){
  if(e.target.dataset && e.target.dataset.passwordStrength==='true'){
    updatePasswordStrengthUI(e.target.id,e.target.value);
  } else if(e.target.id==='focusSleepInput'){
    const out=document.getElementById('sleepOutput');
    if(out) out.textContent=e.target.value+'h';
  } else if(e.target.id==='focusEnergyInput'){
    const out=document.getElementById('energyOutput');
    if(out) out.textContent=e.target.value+'/5';
  } else if(e.target.id==='focusStressInput'){
    const out=document.getElementById('stressOutput');
    if(out) out.textContent=e.target.value+'/5';
  }
});

document.addEventListener('change', function(e){
  const id = e.target.id || '';
  if(id.indexOf('editCategory_')===0){
    state.editScheduleDraftCategory = e.target.value;
  } else if(id.indexOf('scheduleTimeInput_')===0){
    state.editScheduleDraftTime = e.target.value;
  }
});

window.addEventListener('online',function(){
  session.syncMessage='Conexão restaurada. Enviando alterações...';
  if(session.accessToken) flushMutationQueue(false);
});
window.addEventListener('offline',function(){
  session.syncMessage='Sem internet. Novas alterações ficarão protegidas neste aparelho.';
  if(session.view==='app' && state && state.currentPage==='settings') renderApp();
});

/* ---------- Init ---------- */
async function initApp(){
  session.view = 'loading';
  renderApp();
  try{
    registerKaizenServiceWorker();
    registerNativeOAuthListener();
    const sessionData = await loadSession();
    const index = await loadProfileIndex();
    session.profiles = index;

    if(backendEnabled()){
      const oauthCode=oauthCodeFromUrl(window.location.href);
      const oauthError=oauthErrorFromUrl(window.location.href);
      if(oauthCode){
        session.view='picker';
        session.authScreen='google';
        await finishGoogleOAuth(oauthCode,window.location.href);
        return;
      }
      if(oauthError){
        clearOAuthUrlParameter(window.location.href,'oauth_error');
        session.view='picker';
        session.authScreen='google';
        showAuthFailure('O acesso com Google foi cancelado.');
        return;
      }
      const refreshed=await refreshBackendSession(false);
      if(refreshed){ await enterBackendAccount(refreshed); return; }
    }

    if(sessionData && sessionData.activeId && index.some(function(p){ return p.id===sessionData.activeId; })){
      const core = await loadProfileData(sessionData.activeId);
      if(core){
        state = hydrateProfile(sessionData.activeId, core);
        applyEquippedVisuals();
        session.activeId = sessionData.activeId;
        session.view = 'app';
        applyRequestedPage();
        renderApp();
        return;
      }
    }

    if(index.length===0){
      // A primeira abertura agora começa pela criação de uma conta.
      state = null;
      session.activeId = null;
      session.authScreen = 'login';
      session.view = 'picker';
      renderApp();
      return;
    }

    session.view = 'picker';
    renderApp();
  } catch(err){
    console.error('initApp failed, falling back to an in-memory demo profile:', err);
    const id = 'p-demo-gabriel';
    state = hydrateProfile(id, createDemoProfile());
    applyEquippedVisuals();
    session.activeId = id;
    session.view = 'app';
    renderApp();
  }
}
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}
</script>
