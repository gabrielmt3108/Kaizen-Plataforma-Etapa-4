<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7C3AED">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Kaizen Life</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./kaizen-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0F19;
  --card:#111827;
  --card-secondary:#1A2332;
  --card-premium:#232F45;
  --text:#F8FAFC;
  --text-secondary:#94A3B8;
  --text-muted:#5B6577;
  --green:#22C55E;
  --blue:#3B82F6;
  --gold:#FBBF24;
  --purple-cyber:#7C3AED;
  --purple-neon:#A855F7;
  --purple-glow:#C084FC;
  --danger:#F87171;
  --border:rgba(148,163,184,0.12);
  --on-accent:#FFFFFF;
  --on-success:#07110A;
  --on-danger:#FFFFFF;
  --shadow-color:rgba(0,0,0,0.70);
  --accent-soft:color-mix(in srgb,var(--purple-neon) 14%,transparent);
  --accent-border:color-mix(in srgb,var(--purple-neon) 34%,transparent);
  --blue-soft:color-mix(in srgb,var(--blue) 12%,transparent);
  --success-soft:color-mix(in srgb,var(--green) 13%,transparent);
  --warning-soft:color-mix(in srgb,var(--gold) 10%,transparent);
  --danger-soft:color-mix(in srgb,var(--danger) 12%,transparent);
  --glass-card:color-mix(in srgb,var(--card) 82%,transparent);
  --glass-secondary:color-mix(in srgb,var(--card-secondary) 78%,transparent);
  --radius-lg:20px;
  --radius-md:16px;
  --radius-sm:10px;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;overflow-x:hidden;}
body{
  background-image:
    var(--wallpaper-layer, none),
    radial-gradient(1200px 600px at 12% -10%, color-mix(in srgb,var(--blue) 10%,transparent), transparent 60%),
    radial-gradient(1000px 550px at 105% 0%, color-mix(in srgb,var(--purple-neon) 9%,transparent), transparent 55%);
  background-color: var(--bg);
  background-size: var(--wallpaper-size, auto), auto, auto;
  background-position:var(--wallpaper-position,0 0),center,center;
  background-repeat:var(--wallpaper-repeat,repeat),no-repeat,no-repeat;
  background-attachment:fixed;
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button{ font-family:inherit; font-size:inherit; color:inherit; cursor:pointer; touch-action:manipulation; appearance:none; -webkit-appearance:none; background:none; border:none; padding:0; margin:0; text-align:inherit; }
input,select,textarea{ font-family:inherit; font-size:14px; color:var(--text); background:var(--card-secondary); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 14px; outline:none; }
input:focus,select:focus,textarea:focus{ border-color:var(--purple-neon); }
textarea{ width:100%; resize:vertical; font-family:var(--font-body); line-height:1.5; }
:focus-visible{ outline:2px solid var(--purple-neon); outline-offset:2px; }
h1,h2,h3,h4,h5{ font-family:var(--font-display); margin:0; font-weight:700; letter-spacing:-0.01em; }
h2{ font-size:26px; }
h3{ font-size:17px; font-weight:600; }
h4{ font-size:13.5px; font-weight:600; margin:0 0 10px; display:flex; align-items:center; gap:6px; color:var(--text); }
h5{ font-size:13px; font-weight:600; margin:0 0 2px; }
p{ margin:0; line-height:1.55; color:var(--text-secondary); font-size:14px; }
ul{ margin:0; padding:0 0 0 18px; color:var(--text-secondary); font-size:13.5px; line-height:1.6; }
li{ margin-bottom:2px; }
a{ color:inherit; }
.icon{ width:20px; height:20px; flex-shrink:0; }
.tiny-icon{ width:13px; height:13px; }
.stat-icon{ width:18px; height:18px; color:var(--text-secondary); }
.chip-icon{ width:14px; height:14px; }
.link-icon{ width:14px; height:14px; }
.lock-icon{ width:14px; height:14px; color:var(--text-muted); }
.row-icon{ width:15px; height:15px; margin-right:8px; vertical-align:-3px; color:var(--text-secondary); }
.achv-icon{ width:26px; height:26px; color:var(--purple-neon); margin-bottom:8px; }
.flame-icon{ color:var(--gold); }

/* ---------- Layout shell ---------- */
#app{ display:flex; min-height:100vh; align-items:stretch; }
#sidebar{
  width:240px; flex-shrink:0; position:fixed; top:0; left:0; bottom:0;
  background:var(--glass-card); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:22px 16px; z-index:100; overflow-y:auto;
}
.brand{ display:flex; align-items:center; gap:10px; padding:4px 10px 26px; }
.brand-mark{ width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:16px; color:var(--on-accent); background:linear-gradient(135deg,var(--purple-cyber),var(--purple-neon)); box-shadow:0 0 18px color-mix(in srgb,var(--purple-neon) 45%,transparent); }
.brand-text{ font-family:var(--font-display); font-weight:700; font-size:16.5px; }
.brand-text span{ color:var(--purple-glow); }
.sidebar-nav{ display:flex; flex-direction:column; gap:2px; flex:1; }
.nav-item{ display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:12px; position:relative; color:var(--text-secondary); font-size:14px; font-weight:500; transition:background .18s ease,color .18s ease; }
.nav-item:hover{ background:color-mix(in srgb,var(--text-secondary) 8%,transparent); color:var(--text); }
.nav-item.active{ background:linear-gradient(90deg,color-mix(in srgb,var(--purple-cyber) 22%,transparent),color-mix(in srgb,var(--purple-neon) 7%,transparent)); color:var(--text); }
.nav-item .nav-icon{ width:19px; height:19px; }
.nav-item .nav-accent{ position:absolute; left:-16px; top:50%; transform:translateY(-50%); width:3px; height:0; border-radius:3px; background:linear-gradient(var(--blue),var(--purple-neon)); transition:height .18s ease; }
.nav-item.active .nav-accent{ height:22px; }
.sidebar-footer{ padding-top:14px; border-top:1px solid var(--border); }

#main{ flex:1; margin-left:240px; min-height:100vh; min-width:0; display:flex; flex-direction:column; }
#topbar{ display:flex; align-items:flex-start; justify-content:space-between; gap:24px; padding:30px 32px 6px; }
.topbar-title{ min-width:0; }
.topbar-stats{ display:flex; gap:10px; flex-shrink:0; }
.pill{ display:flex; align-items:center; gap:7px; background:var(--card); border:1px solid var(--border); padding:9px 14px; border-radius:999px; font-family:var(--font-mono); font-weight:600; font-size:13.5px; transition:transform .15s ease,border-color .15s ease; }
.pill:hover{ transform:translateY(-1px); border-color:color-mix(in srgb,var(--text-secondary) 34%,transparent); }
.pill-icon{ width:15px; height:15px; color:var(--gold); }
.pill.gold .pill-icon{ color:var(--gold); }

#page-content{ padding:14px 32px 100px; max-width:1180px; width:100%; min-width:0; margin:0 auto; position:relative; }
#page-content > *{ animation:fadeInUp .5s ease both; }
#page-content > *:nth-child(1){ animation-delay:.02s; }
#page-content > *:nth-child(2){ animation-delay:.06s; }
#page-content > *:nth-child(3){ animation-delay:.10s; }
#page-content > *:nth-child(4){ animation-delay:.14s; }
#page-content > *:nth-child(5){ animation-delay:.18s; }
#page-content > *:nth-child(n+6){ animation-delay:.20s; }

#mobile-nav-fab{ display:none; position:fixed; right:max(16px,env(safe-area-inset-right)); bottom:calc(16px + env(safe-area-inset-bottom)); z-index:300; min-width:96px; height:54px; padding:0 18px; border-radius:18px; align-items:center; justify-content:center; gap:8px; color:var(--on-accent); background:linear-gradient(135deg,var(--purple-cyber),var(--purple-neon)); border:1px solid color-mix(in srgb,var(--purple-glow) 42%,transparent); box-shadow:0 16px 38px -10px color-mix(in srgb,var(--purple-neon) 72%,transparent),0 1px 0 color-mix(in srgb,var(--text) 18%,transparent) inset; font-size:13px; font-weight:700; }
#mobile-nav-fab .icon{ width:20px; height:20px; }
#mobile-nav-fab.open{ background:var(--card-premium); color:var(--text); border-color:var(--accent-border); box-shadow:0 16px 38px -12px var(--shadow-color); }
#mobile-nav-layer{ display:none; }
.mobile-nav-backdrop{ position:fixed; inset:0; width:100%; height:100%; background:color-mix(in srgb,var(--bg) 62%,transparent); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); }
.mobile-nav-sheet{ position:fixed; top:max(10px,env(safe-area-inset-top)); right:max(10px,env(safe-area-inset-right)); bottom:max(10px,env(safe-area-inset-bottom)); width:min(370px,calc(100vw - 20px)); overflow-y:auto; overscroll-behavior:contain; background:color-mix(in srgb,var(--card) 97%,transparent); border:1px solid var(--accent-border); border-radius:24px; padding:20px 18px 88px; box-shadow:-24px 0 70px var(--shadow-color); transform:translateX(calc(100% + 30px)); opacity:0; transition:transform .24s ease,opacity .2s ease; }
.mobile-nav-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
.mobile-nav-head h3{ font-size:17px; }
.mobile-nav-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
.mobile-nav-link{ min-height:58px; display:flex; align-items:center; gap:11px; padding:11px 12px; border-radius:14px; background:var(--card-secondary); border:1px solid var(--border); color:var(--text-secondary); font-size:12.5px; font-weight:600; }
.mobile-nav-link .icon{ width:19px; height:19px; color:var(--purple-glow); }
.mobile-nav-link.active{ color:var(--text); border-color:var(--purple-neon); background:linear-gradient(135deg,var(--accent-soft),var(--card-secondary)); }
.mobile-nav-summary{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:14px; padding:12px 14px; border-radius:14px; background:var(--card-premium); color:var(--text-secondary); font-size:11.5px; }
.mobile-nav-summary strong{ color:var(--text); font-family:var(--font-mono); }
.mobile-menu-open{ overflow:hidden; }

@media (max-width:1100px){
  #sidebar{ display:none; }
  #mobile-nav-fab{ display:flex; }
  #main{ margin-left:0; padding-bottom:70px; }
  #topbar{ padding:22px 18px 4px; flex-direction:column; gap:14px; }
  .topbar-stats{ width:100%; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); }
  .pill{ min-width:0; justify-content:center; padding:9px 8px; }
  #page-content{ padding:12px 18px 96px; }
  h2{ font-size:22px; }
  #mobile-nav-layer{ display:block; position:fixed; inset:0; z-index:260; visibility:hidden; pointer-events:none; }
  #mobile-nav-layer.open{ visibility:visible; pointer-events:auto; }
  #mobile-nav-layer.open .mobile-nav-sheet{ transform:translateX(0); opacity:1; }
}

/* ---------- Generic components ---------- */
.section-header{ margin:22px 0 16px; }
.section-header h2{ margin-top:4px; }
.section-eyebrow{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:0.14em; color:var(--purple-glow); text-transform:uppercase; margin-bottom:6px; font-weight:600; display:block; }
.muted{ color:var(--text-secondary); }
.small-label{ font-size:12.5px; display:block; margin-bottom:8px; }
.tiny{ font-size:11px; }

.card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:22px; margin-bottom:16px; box-shadow:0 1px 0 color-mix(in srgb,var(--text) 4%,transparent) inset,0 24px 44px -30px var(--shadow-color); }
.card.premium{ background:linear-gradient(160deg,var(--card-premium),var(--card)); box-shadow:0 0 0 1px var(--accent-border),0 24px 50px -22px color-mix(in srgb,var(--purple-cyber) 45%,transparent); }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 20px; border-radius:12px; font-weight:600; font-size:13.5px; transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease; white-space:nowrap; }
.btn .icon{ width:16px; height:16px; }
.btn.primary{ background:linear-gradient(90deg,var(--purple-cyber),var(--purple-neon)); color:var(--on-accent); box-shadow:0 8px 24px -8px color-mix(in srgb,var(--purple-neon) 62%,transparent); }
.btn.primary:hover{ transform:translateY(-1px); box-shadow:0 12px 28px -8px color-mix(in srgb,var(--purple-neon) 78%,transparent); }
.btn.ghost{ background:var(--card-secondary); border:1px solid var(--border); color:var(--text); }
.btn.ghost:hover{ border-color:var(--purple-neon); }
.btn.danger{ background:var(--danger); color:var(--on-danger); box-shadow:0 8px 22px -10px color-mix(in srgb,var(--danger) 72%,transparent); }
.btn.danger:hover{ transform:translateY(-1px); box-shadow:0 11px 26px -10px color-mix(in srgb,var(--danger) 88%,transparent); }
.btn.danger-ghost{ background:var(--danger-soft); color:var(--danger); border:1px solid color-mix(in srgb,var(--danger) 32%,transparent); }
.btn.danger-ghost:hover{ border-color:var(--danger); }
.btn.small{ padding:9px 14px; font-size:12.5px; }
.btn:disabled{ opacity:.45; cursor:not-allowed; transform:none !important; box-shadow:none !important; }
.link-btn-inline,.link-btn{ display:inline-flex; align-items:center; gap:4px; color:var(--blue); font-size:13px; font-weight:600; margin-top:8px; }
button.link-btn:hover,button.link-btn-inline:hover{ color:var(--purple-glow); }

.icon-btn{ width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; background:var(--card-secondary); border:1px solid var(--border); }
.icon-btn:hover{ border-color:var(--purple-neon); }
.icon-btn:disabled{ opacity:.3; cursor:not-allowed; }
.icon-btn .icon{ width:15px; height:15px; }

.progress-track{ height:9px; background:var(--card-secondary); border-radius:999px; overflow:hidden; position:relative; }
.progress-track.thin{ height:6px; }
.progress-fill{ height:100%; border-radius:999px; width:0; animation:fillBar 1s cubic-bezier(.2,.8,.2,1) forwards; }

.tag{ display:inline-flex; align-items:center; font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; background:color-mix(in srgb, var(--tag-color) 16%, transparent); color:var(--tag-color); border:1px solid color-mix(in srgb, var(--tag-color) 35%, transparent); }

.quick-add{ display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
.quick-add input{ flex:1; min-width:180px; }
.quick-add select{ width:auto; }

.quick-add-habit{ margin-bottom:18px; }
.quick-add-habit > input[type="text"]{ width:100%; margin-bottom:12px; }
.quick-add-habit .quick-add{ margin-bottom:12px; }
.quick-add-row2{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.quick-add-row2 input[type="time"]{ width:auto; }
.qa-label{ font-size:11.5px; color:var(--text-secondary); font-weight:600; display:flex; align-items:center; gap:4px; white-space:nowrap; }

.day-picker{ display:flex; gap:5px; }
.day-pick-btn{ width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700; background:var(--card-secondary); border:1px solid var(--border); color:var(--text-secondary); flex-shrink:0; }
.day-pick-btn.active{ background:linear-gradient(135deg,var(--blue),var(--purple-neon)); color:var(--on-accent); border-color:transparent; }

.schedule-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; width:100%; padding:2px 0 6px; }
.schedule-time{ display:flex; align-items:center; gap:5px; font-family:var(--font-mono); font-size:11.5px; color:var(--text-secondary); background:var(--card-secondary); padding:4px 9px; border-radius:999px; flex-shrink:0; }
.schedule-days{ display:flex; gap:3px; }
.schedule-day{ width:18px; height:18px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:9.5px; font-weight:700; color:var(--text-muted); background:var(--card-secondary); border:1px solid var(--border); }
.schedule-day.active{ background:linear-gradient(135deg,var(--blue),var(--purple-neon)); color:var(--on-accent); border-color:transparent; }
.schedule-edit{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:6px 0 8px; padding:10px; background:var(--card-secondary); border-radius:var(--radius-sm); }
.schedule-edit input[type="time"]{ width:auto; }
.schedule-edit select{ width:auto; }
.edit-trigger-btn{ width:24px; height:24px; border-radius:7px; display:flex; align-items:center; justify-content:center; background:var(--card-secondary); border:1px solid var(--border); flex-shrink:0; margin-left:auto; }
.edit-trigger-btn:hover{ border-color:var(--purple-neon); }
.edit-trigger-btn .icon{ width:12px; height:12px; color:var(--text-secondary); }
.item-card-tools{ display:flex; align-items:center; gap:6px; margin-left:auto; }
.item-card-tools .edit-trigger-btn{ margin-left:0; }
.delete-trigger-btn{ width:24px; height:24px; border-radius:7px; display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--danger); background:var(--danger-soft); border:1px solid color-mix(in srgb,var(--danger) 24%,transparent); }
.delete-trigger-btn:hover{ border-color:var(--danger); background:color-mix(in srgb,var(--danger) 18%,transparent); }
.delete-trigger-btn .icon{ width:12px; height:12px; }
.icon-btn.danger-action{ color:var(--danger); border-color:color-mix(in srgb,var(--danger) 24%,transparent); background:var(--danger-soft); }
.icon-btn.danger-action:hover{ border-color:var(--danger); }
.entity-delete-confirm{ display:flex; align-items:center; justify-content:space-between; gap:14px; width:100%; padding:12px 13px; margin-top:10px; border-radius:12px; background:var(--danger-soft); border:1px solid color-mix(in srgb,var(--danger) 32%,transparent); }
.entity-delete-confirm-copy{ min-width:0; }
.entity-delete-confirm-copy strong{ display:block; color:var(--danger); font-size:12.5px; margin-bottom:3px; overflow-wrap:anywhere; }
.entity-delete-confirm-copy span{ display:block; color:var(--text-secondary); font-size:11.5px; line-height:1.4; }
.entity-delete-actions{ display:flex; align-items:center; gap:7px; flex-shrink:0; }

.empty-state{ text-align:center; padding:26px 14px; color:var(--text-secondary); }
.empty-state.small{ padding:16px 10px; font-size:12.5px; }
.empty-state.error p{ color:var(--danger); margin-bottom:12px; }

.context-chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ display:flex; align-items:center; gap:6px; background:var(--card-secondary); border:1px solid var(--border); padding:7px 12px; border-radius:999px; font-size:12.5px; color:var(--text-secondary); font-family:var(--font-mono); }

.tabs,.filter-tabs{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
.tab{ padding:9px 16px; border-radius:999px; background:var(--card-secondary); border:1px solid var(--border); font-size:12.5px; font-weight:600; color:var(--text-secondary); }
.tab.active{ background:linear-gradient(90deg,var(--purple-cyber),var(--purple-neon)); color:var(--on-accent); border-color:transparent; }

.switch{ width:42px; height:24px; border-radius:999px; background:var(--card-secondary); border:1px solid var(--border); position:relative; flex-shrink:0; transition:background .18s ease; }
.switch .switch-knob{ position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:var(--text-secondary); transition:transform .18s ease, background .18s ease; }
.switch.on{ background:linear-gradient(90deg,var(--purple-cyber),var(--purple-neon)); border-color:transparent; }
.switch.on .switch-knob{ transform:translateX(18px); background:var(--on-accent); }
.settings-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--border); font-size:13.5px; }
.settings-row:last-child{ border-bottom:none; }
.settings-section{ margin-bottom:16px; }
.name-edit{ display:flex; gap:8px; }
.name-edit input{ width:160px; }

/* ---------- Result blocks (Coach + Reports) ---------- */
.quote-block{ display:flex; gap:12px; align-items:flex-start; background:var(--card-secondary); border:1px solid var(--border); border-radius:var(--radius-md); padding:16px 18px; margin-bottom:16px; }
.quote-block .icon{ color:var(--purple-glow); margin-top:2px; }
.quote-block p{ color:var(--text); font-size:14.5px; font-style:italic; }
.result-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
@media (max-width:640px){ .result-grid{ grid-template-columns:1fr; } }
.result-block{ background:var(--card-secondary); border-radius:var(--radius-md); padding:16px 18px; border:1px solid var(--border); margin-bottom:14px; }
.result-grid .result-block{ margin-bottom:0; }
.result-block h4{ font-size:13px; }
.result-block.strength{ border-color:color-mix(in srgb,var(--green) 34%,transparent); } .result-block.strength h4{ color:var(--green); }
.result-block.weakness{ border-color:color-mix(in srgb,var(--gold) 34%,transparent); } .result-block.weakness h4{ color:var(--gold); }
.result-block.suggestion{ border-color:color-mix(in srgb,var(--blue) 34%,transparent); } .result-block.suggestion h4{ color:var(--blue); }
.result-block.onepercent{ background:linear-gradient(160deg,var(--accent-soft),var(--card-secondary)); border-color:var(--accent-border); } .result-block.onepercent h4{ color:var(--purple-glow); }

.coach-loading{ display:flex; flex-direction:column; align-items:center; gap:14px; padding:30px 10px; color:var(--text-secondary); font-size:13.5px; }

/* ---------- Mascot ---------- */

.mascot-orb{ width:var(--size); height:var(--size); border-radius:50%; position:relative; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--purple-neon) 36%,transparent),color-mix(in srgb,var(--bg) 22%,transparent) 70%); animation:floatY 4.5s ease-in-out infinite; }
.mascot-glow{ position:absolute; inset:8%; border-radius:50%; box-shadow:0 0 30px 6px color-mix(in srgb,var(--purple-neon) 42%,transparent); animation:glowPulse 3s ease-in-out infinite; }
.mascot-emoji{ position:relative; z-index:1; filter:drop-shadow(0 4px 10px var(--shadow-color)); }
.mascot-name{ font-family:var(--font-display); font-weight:600; font-size:13.5px; }
.mascot-bar{ width:80px; }
.sidebar-footer .mascot-widget{ gap:6px; }
.sidebar-footer .mascot-name{ font-size:12px; }
.sidebar-footer .mascot-bar{ width:64px; }
.sidebar-footer .mascot-caption{ display:none; }
.profile-hero .mascot-bar{ width:120px; }

/* ---------- Ring / chart ---------- */
.ring-wrap{ position:relative; display:inline-flex; }
.score-ring{ transform:rotate(-90deg); display:block; }
.score-ring.big{ width:120px; height:120px; }
.score-ring.small{ width:88px; height:88px; }
.ring-track{ fill:none; stroke:color-mix(in srgb,var(--text-secondary) 18%,transparent); stroke-width:9; }
.ring-fill{ fill:none; stroke-width:9; stroke-linecap:round; animation:ringFill 1.1s ease-out forwards; }
.score-num{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:700; font-size:26px; }
.score-num.small{ font-size:19px; }
.score-num-suffix{ font-family:var(--font-body); font-weight:500; font-size:10px; color:var(--text-secondary); }
.area-chart{ width:100%; height:auto; display:block; }
.chart-grid{ stroke:color-mix(in srgb,var(--text-secondary) 14%,transparent); stroke-width:1; }
.chart-label{ fill:var(--text-muted); font-size:10px; font-family:var(--font-mono); }
.chart-dot{ fill:var(--purple-glow); }
.chart-line{ filter:drop-shadow(0 2px 6px color-mix(in srgb,var(--purple-neon) 40%,transparent)); }

/* ---------- Dashboard ---------- */
.stat-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:16px; }

@media (max-width:768px){ .stat-row{ grid-template-columns:repeat(2,1fr); } }
.stat-card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius-md); padding:18px; display:flex; flex-direction:column; gap:10px; }

.stat-top{ display:flex; align-items:center; justify-content:space-between; }
.stat-label{ font-size:11.5px; color:var(--text-secondary); font-weight:600; text-transform:uppercase; letter-spacing:0.03em; display:flex; align-items:center; gap:6px; }
.stat-value{ font-family:var(--font-mono); font-size:30px; font-weight:700; display:flex; align-items:baseline; gap:8px; }
.stat-value.small{ font-size:22px; }
.stat-suffix{ font-family:var(--font-body); font-size:12px; font-weight:500; color:var(--text-secondary); }
.stat-foot{ font-size:11.5px; color:var(--text-muted); }
.week-dots{ display:flex; gap:6px; }

.week-dot-col{ display:flex; flex-direction:column; align-items:center; gap:3px; }
.week-dot-label{ font-size:8.5px; font-weight:700; color:var(--text-muted); font-family:var(--font-mono); line-height:1; }

.week-dot{ width:11px; height:11px; border-radius:4px; background:var(--card-secondary); border:1px solid var(--border); }
.week-dot.done{ background:linear-gradient(135deg,var(--green),color-mix(in srgb,var(--green) 70%,#000)); border-color:transparent; }
.week-dot.today{ box-shadow:0 0 0 2px var(--purple-neon); }
.stat-card.score{ align-items:center; }

.mission-card{ display:flex; flex-direction:column; gap:12px; }
.mission-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex-wrap:wrap; }
.mission-head h3{ margin-top:4px; max-width:420px; }
.mission-reward{ display:flex; align-items:center; gap:6px; font-family:var(--font-mono); font-weight:700; color:var(--gold); font-size:15px; white-space:nowrap; }

.dash-grid{ display:grid; grid-template-columns:1.15fr 1fr; gap:16px; align-items:start; }
@media (max-width:968px){ .dash-grid{ grid-template-columns:1fr; } }
.dash-col{ display:flex; flex-direction:column; }

.coach-preview{ display:flex; gap:14px; align-items:flex-start; width:100%; }
.coach-preview:hover{ border-color:color-mix(in srgb,var(--purple-neon) 44%,transparent); }
.coach-preview p{ margin:4px 0 2px; font-size:13.5px; }

.coach-avatar{ width:52px; height:52px; border-radius:16px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--blue),var(--purple-cyber)); box-shadow:0 0 22px color-mix(in srgb,var(--blue) 40%,transparent); }
.coach-avatar .icon{ width:26px; height:26px; color:var(--on-accent); }

.habits-mini{ display:flex; flex-direction:column; gap:2px; }

/* ---------- Habit toggle ---------- */
.habit-check{ width:30px; height:30px; border-radius:50%; border:2px solid var(--text-muted); flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:transform .18s ease, background .18s ease, border-color .18s ease; }
.habit-check:hover{ border-color:var(--purple-neon); }

/* ---------- Habits page ---------- */
.habit-list{ display:flex; flex-direction:column; gap:12px; }

.habit-streak .streak-icon{ width:18px; height:18px; }

/* ---------- Kanban ---------- */
.kanban{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; align-items:start; }
@media (max-width:768px){ .kanban{ grid-template-columns:1fr; } }
.kanban-col{ background:var(--card); border:1px solid var(--border); border-top:3px solid var(--col-accent); border-radius:var(--radius-md); padding:14px; }

.goal-pct{ font-family:var(--font-mono); font-weight:700; font-size:13px; color:var(--text-secondary); margin-left:auto; }

.goal-text{ color:var(--text); font-weight:500; font-size:14px; margin-bottom:10px; }

/* ---------- Coach / Reports hero ---------- */
.coach-hero{ display:flex; align-items:center; gap:16px; }
.report-hero{ display:flex; align-items:center; gap:26px; flex-wrap:wrap; }
.report-stats{ display:flex; gap:22px; flex-wrap:wrap; }
.report-stat{ display:flex; flex-direction:column; gap:2px; }

.rs-value{ font-family:var(--font-mono); font-weight:700; font-size:18px; }
.journal-box textarea{ margin-bottom:12px; }

/* ---------- Store ---------- */
#page-content.store-theme{
  background:
    radial-gradient(900px 560px at 15% 0%,color-mix(in srgb,var(--purple-cyber) 28%,transparent),transparent 62%),
    radial-gradient(700px 460px at 100% 25%,color-mix(in srgb,var(--purple-glow) 17%,transparent),transparent 58%),

}

.holo-title{ background:linear-gradient(90deg,var(--purple-cyber),var(--purple-neon),var(--purple-glow)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.store-balance-card{ display:flex; align-items:center; justify-content:space-between; position:relative; z-index:1; background:var(--glass-secondary); border:1px solid var(--accent-border); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
.balance-value{ font-family:var(--font-mono); font-size:24px; font-weight:700; display:flex; align-items:center; gap:8px; color:var(--gold); }

.shop-grid{ position:relative; z-index:1; display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:16px; }
.shop-card{ background:var(--glass-secondary); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid color-mix(in srgb,var(--purple-neon) 28%,var(--border)); border-radius:18px; padding:20px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px; transition:transform .18s ease,border-color .18s ease,background .18s ease; }
.shop-card:hover{ transform:translateY(-3px); border-color:color-mix(in srgb,var(--purple-glow) 62%,transparent); background:color-mix(in srgb,var(--card-secondary) 88%,transparent); }
.shop-icon{ font-size:34px; margin-bottom:6px; filter:drop-shadow(0 4px 12px color-mix(in srgb,var(--purple-neon) 52%,transparent)); }
.shop-desc{ font-size:12px; min-height:32px; }
.rarity-tag{ font-size:9.5px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; padding:3px 10px; border-radius:999px; margin:6px 0 4px; }
.rarity-tag.rarity-comum{ background:color-mix(in srgb,var(--text-secondary) 18%,transparent); color:var(--text-secondary); }
.rarity-tag.rarity-raro{ background:color-mix(in srgb,var(--blue) 18%,transparent); color:var(--blue); }
.rarity-tag.rarity-epico{ background:color-mix(in srgb,var(--purple-neon) 20%,transparent); color:var(--purple-glow); }
.rarity-tag.rarity-lendario{ background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 26%,transparent),color-mix(in srgb,var(--purple-neon) 26%,transparent)); color:var(--gold); }
.shop-card.rarity-lendario{ border:1px solid transparent; background-image:linear-gradient(var(--glass-secondary),var(--glass-secondary)),linear-gradient(90deg,var(--gold),var(--purple-neon),var(--gold)); background-origin:border-box; background-clip:padding-box,border-box; box-shadow:0 0 30px color-mix(in srgb,var(--gold) 22%,transparent); }
.shop-buy-btn{ width:100%; margin-top:8px; background:linear-gradient(90deg,var(--purple-cyber),var(--purple-neon)); color:var(--on-accent); padding:10px; border-radius:11px; font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; gap:6px; }

.theme-swatch-preview{ display:flex; gap:4px; margin-bottom:8px; }
.swatch-dot{ width:16px; height:16px; border-radius:50%; border:1px solid color-mix(in srgb,var(--text) 22%,transparent); }

.wallpaper-preview{ width:100%; height:86px; border-radius:12px; border:1px solid var(--border); background-color:color-mix(in srgb,var(--bg) 70%,var(--card-premium)); margin-bottom:8px; background-repeat:var(--preview-repeat,repeat); background-position:var(--preview-position,0 0); position:relative; overflow:hidden; box-shadow:0 10px 24px -18px var(--shadow-color),0 1px 0 color-mix(in srgb,var(--text) 7%,transparent) inset; }
.wallpaper-preview::after{ content:''; position:absolute; inset:-60% -35%; pointer-events:none; opacity:0; transform:translateX(-45%) rotate(18deg); background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--text) 18%,transparent),transparent); }
.shop-card.rarity-epico .wallpaper-preview{ border-color:color-mix(in srgb,var(--purple-neon) 54%,transparent); box-shadow:0 0 24px color-mix(in srgb,var(--purple-neon) 18%,transparent),0 1px 0 color-mix(in srgb,var(--text) 8%,transparent) inset; }
.shop-card.rarity-epico .wallpaper-preview::after{ opacity:.38; animation:wallpaperPreviewShine 5.5s ease-in-out infinite; }
.shop-card.rarity-lendario .wallpaper-preview{ border-color:var(--gold); box-shadow:0 0 28px color-mix(in srgb,var(--gold) 26%,transparent),0 0 0 1px color-mix(in srgb,var(--purple-neon) 26%,transparent) inset; }
.shop-card.rarity-lendario .wallpaper-preview::after{ opacity:.62; background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--gold) 30%,transparent),color-mix(in srgb,var(--purple-glow) 22%,transparent),transparent); animation:wallpaperPreviewShine 3.8s ease-in-out infinite; }
.inv-count{ font-size:11px; color:var(--purple-glow); font-family:var(--font-mono); margin-bottom:2px; }
.inventory-strip{ position:relative; z-index:1; border-color:var(--accent-border); background:var(--glass-secondary); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }

.inv-name{ font-size:12px; font-weight:500; white-space:nowrap; }
.inv-badge{ font-family:var(--font-mono); font-size:11px; color:var(--gold); font-weight:700; }

/* ---------- Profile ---------- */
.profile-hero{ display:flex; align-items:center; gap:26px; flex-wrap:wrap; }

/* ---------- Settings ---------- */
.theme-row{ display:flex; gap:12px; flex-wrap:wrap; }

/* ---------- Projeto Central / foco profundo ---------- */

  background:
    radial-gradient(760px 430px at 5% 0%,color-mix(in srgb,var(--purple-neon) 17%,transparent),transparent 62%),

}

.timer-card{ text-align:center; border-color:var(--accent-border); }
.timer-dial{ --timer-pct:0%; width:220px; height:220px; margin:18px auto; border-radius:50%; padding:10px; background:conic-gradient(var(--purple-neon) var(--timer-pct),color-mix(in srgb,var(--text-secondary) 15%,transparent) 0); box-shadow:0 0 42px -18px color-mix(in srgb,var(--purple-neon) 82%,transparent); }
.timer-inner{ width:100%; height:100%; border-radius:50%; background:var(--card); display:flex; flex-direction:column; align-items:center; justify-content:center; border:1px solid var(--border); }
.timer-time{ font-family:var(--font-mono); font-size:42px; font-weight:700; letter-spacing:-.04em; }
.timer-label{ font-size:11px; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.1em; margin-top:5px; }
.timer-actions{ display:flex; align-items:center; justify-content:center; gap:9px; flex-wrap:wrap; }
.timer-presets{ display:flex; justify-content:center; gap:7px; flex-wrap:wrap; margin-top:14px; }
.timer-preset{ padding:7px 10px; border-radius:999px; background:var(--card-secondary); border:1px solid var(--border); color:var(--text-secondary); font-size:11.5px; font-family:var(--font-mono); }
.timer-preset.active{ color:var(--text); border-color:var(--purple-neon); background:var(--accent-soft); }
.focus-form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.focus-form-grid .full{ grid-column:1/-1; }
.focus-form-actions{ display:flex; align-items:center; gap:9px; justify-content:flex-end; flex-wrap:wrap; margin-top:14px; }
.focus-form-actions .danger-ghost{ margin-right:auto; }
.field-label{ display:flex; flex-direction:column; gap:7px; color:var(--text-secondary); font-size:11.5px; font-weight:600; }
.field-label input,.field-label textarea,.field-label select{ width:100%; }
.mode-selector{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.mode-option{ padding:15px; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--card-secondary); text-align:left; }
.mode-option strong{ display:block; color:var(--text); font-size:13.5px; margin-bottom:4px; }
.mode-option span{ display:block; font-size:11.5px; color:var(--text-secondary); line-height:1.45; }
.mode-option.active{ border-color:var(--purple-neon); background:linear-gradient(145deg,var(--accent-soft),var(--card-secondary)); box-shadow:0 0 0 1px color-mix(in srgb,var(--purple-neon) 14%,transparent) inset; }
.health-score-row{ display:flex; align-items:center; gap:14px; margin:12px 0 16px; }
.health-score{ width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:700; font-size:18px; border:5px solid var(--health-color,var(--green)); background:var(--card-secondary); flex-shrink:0; }
.health-copy strong{ display:block; margin-bottom:4px; font-size:13.5px; }
.health-copy p{ font-size:12px; }
.health-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.health-grid > .full{ grid-column:1/-1; }
.health-field{ background:var(--card-secondary); border:1px solid var(--border); border-radius:12px; padding:11px; }
.health-field label{ display:flex; justify-content:space-between; gap:10px; font-size:11.5px; color:var(--text-secondary); margin-bottom:8px; }
.health-field output{ color:var(--text); font-family:var(--font-mono); font-weight:700; }
.health-field input[type="range"]{ width:100%; padding:0; border:none; accent-color:var(--purple-neon); background:transparent; }
.health-toggles{ grid-column:1/-1; display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.health-toggle{ display:flex; align-items:center; gap:8px; background:var(--card-secondary); border:1px solid var(--border); border-radius:11px; padding:10px; color:var(--text-secondary); font-size:11.5px; cursor:pointer; }
.health-toggle input{ width:16px; height:16px; margin:0; padding:0; accent-color:var(--green); }
.safety-banner{ display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:12px; margin:12px 0; background:var(--warning-soft); border:1px solid color-mix(in srgb,var(--gold) 28%,transparent); }
.safety-banner.danger{ background:var(--danger-soft); border-color:color-mix(in srgb,var(--danger) 34%,transparent); }
.safety-banner .icon{ width:17px; height:17px; color:var(--gold); margin-top:1px; }
.safety-banner.danger .icon{ color:var(--danger); }
.safety-banner p{ font-size:12px; }
.ritual-list,.milestone-list{ display:flex; flex-direction:column; gap:8px; }
.ritual-item,.milestone-item{ display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--card-secondary); border:1px solid var(--border); border-radius:11px; }
.ritual-item.done,.milestone-item.done{ border-color:color-mix(in srgb,var(--green) 30%,transparent); }
.ritual-check,.milestone-check{ width:24px; height:24px; border-radius:8px; border:1px solid var(--text-muted); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.ritual-item.done .ritual-check,.milestone-item.done .milestone-check{ background:var(--green); border-color:transparent; color:var(--on-success); }
.ritual-check .icon,.milestone-check .icon{ width:13px; height:13px; }
.ritual-text,.milestone-text{ flex:1; color:var(--text); font-size:12.5px; text-align:left; }
.next-loop{ background:linear-gradient(145deg,var(--blue-soft),var(--card-secondary)); border:1px solid color-mix(in srgb,var(--blue) 30%,transparent); border-radius:var(--radius-md); padding:16px; }
.next-loop strong{ display:block; color:var(--blue); font-size:12px; margin-bottom:6px; }
.next-loop p{ color:var(--text); font-size:13.5px; }
.focus-progress-meta{ display:flex; justify-content:space-between; gap:12px; margin:8px 0 6px; color:var(--text-secondary); font-size:11px; }
.session-history{ display:flex; flex-direction:column; gap:8px; }
.session-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid var(--border); font-size:12px; }
.session-row:last-child{ border-bottom:none; }
.session-minutes{ font-family:var(--font-mono); color:var(--purple-glow); font-weight:700; }
@media (max-width:880px){
  .focus-grid{ grid-template-columns:1fr; }
  .focus-stats{ grid-template-columns:repeat(2,1fr); }
}
@media (max-width:600px){
  .focus-hero{ flex-direction:column; }
  .focus-hero-actions{ align-items:flex-start; }
  .focus-form-grid,.mode-selector,.health-grid{ grid-template-columns:1fr; }
  .focus-form-grid .full,.health-toggles{ grid-column:auto; }
  .health-grid > .full{ grid-column:auto; }
  .health-toggles{ grid-template-columns:1fr; }
  .timer-dial{ width:190px; height:190px; }
  .timer-time{ font-size:36px; }
}

/* ---------- Auth / Profile picker ---------- */
.auth-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:radial-gradient(700px 430px at 15% 0%,color-mix(in srgb,var(--purple-neon) 14%,transparent),transparent 62%),radial-gradient(620px 420px at 100% 100%,color-mix(in srgb,var(--blue) 11%,transparent),transparent 65%); }
.auth-card{ width:100%; max-width:470px; background:linear-gradient(155deg,var(--card-premium),var(--card)); border:1px solid var(--accent-border); border-radius:var(--radius-lg); padding:30px 28px; box-shadow:0 30px 60px -20px var(--shadow-color); animation:fadeInUp .4s ease both; }
.auth-heading{ text-align:center; margin-bottom:20px; }
.auth-heading h2{ margin:4px 0 7px; }
.auth-heading p{ font-size:12.5px; line-height:1.5; }
.auth-form{ display:flex; flex-direction:column; gap:12px; }
.auth-form .field-label{ font-size:12px; }
.auth-password-wrap{ position:relative; }
.auth-password-wrap input{ width:100%; padding-right:50px; }
.password-toggle{ position:absolute; right:5px; top:50%; transform:translateY(-50%); width:38px; height:38px; border-radius:9px; display:flex; align-items:center; justify-content:center; color:var(--text-secondary); }
.password-toggle:hover{ color:var(--text); background:var(--card-secondary); }
.password-toggle .icon{ width:16px; height:16px; }
.auth-primary{ width:100%; }
.auth-divider{ display:flex; align-items:center; gap:10px; margin:17px 0; color:var(--text-muted); font-size:11px; text-transform:uppercase; letter-spacing:.08em; }
.auth-divider::before,.auth-divider::after{ content:''; flex:1; height:1px; background:var(--border); }
.auth-providers{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.provider-btn{ width:100%; background:var(--card-secondary); border:1px solid var(--border); color:var(--text); }
.provider-btn:hover{ border-color:var(--purple-neon); }
.provider-mark{ width:22px; height:22px; border-radius:7px; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:var(--card); font-family:Arial,sans-serif; font-size:13px; font-weight:800; }
.provider-mark.google{ color:#4285f4; }
.auth-switch{ margin-top:17px; text-align:center; color:var(--text-secondary); font-size:12.5px; }
.auth-switch button{ color:var(--purple-glow); font-weight:700; }
.auth-forgot{ display:flex; justify-content:flex-end; margin-top:-5px; }
.auth-forgot button{ color:var(--blue); font-size:11.5px; font-weight:700; }
.auth-forgot button:hover{ color:var(--purple-glow); }
.recovery-methods{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
.recovery-method{ display:flex; align-items:center; justify-content:center; gap:7px; min-height:42px; border-radius:11px; border:1px solid var(--border); background:var(--card-secondary); color:var(--text-secondary); font-size:12px; font-weight:700; }
.recovery-method.active{ color:var(--text); border-color:var(--purple-neon); background:var(--accent-soft); }
.recovery-method .icon{ width:15px; height:15px; }
.auth-message{ padding:10px 12px; border-radius:11px; font-size:12px; line-height:1.45; margin-bottom:13px; border:1px solid var(--border); background:var(--card-secondary); }
.auth-message.error{ color:var(--danger); background:var(--danger-soft); border-color:color-mix(in srgb,var(--danger) 28%,transparent); }
.auth-message.success{ color:var(--green); background:var(--success-soft); border-color:color-mix(in srgb,var(--green) 28%,transparent); }
.auth-prototype-note{ display:flex; gap:9px; align-items:flex-start; margin-top:17px; padding:10px 11px; border-radius:11px; background:var(--warning-soft); border:1px solid color-mix(in srgb,var(--gold) 25%,transparent); }
.auth-prototype-note .icon{ width:16px; height:16px; color:var(--gold); flex-shrink:0; margin-top:1px; }
.auth-prototype-note p{ font-size:10.8px; line-height:1.45; color:var(--text-secondary); }
.password-strength{ margin-top:7px; }
.password-strength-track{ display:grid; grid-template-columns:repeat(5,1fr); gap:4px; }
.password-strength-track span{ height:5px; border-radius:999px; background:var(--border); }
.password-strength-track span.on{ background:var(--strength-color,var(--gold)); }
.password-strength-label{ display:flex; justify-content:space-between; gap:10px; margin-top:5px; font-size:10.5px; color:var(--text-secondary); }
.password-rules{ display:grid; grid-template-columns:1fr 1fr; gap:6px 10px; margin-top:8px; }
.password-rule{ display:flex; align-items:center; gap:5px; color:var(--text-muted); font-size:10.5px; }
.password-rule.ok{ color:var(--green); }
.password-rule .icon{ width:12px; height:12px; }
.otp-input{ font-family:var(--font-mono); text-align:center; letter-spacing:.38em; font-size:24px !important; font-weight:700; }
.auth-back{ margin-top:12px; width:100%; }
.legacy-accounts{ margin-top:18px; padding-top:16px; border-top:1px solid var(--border); }
.legacy-account-row{ display:flex; align-items:center; gap:10px; padding:9px; border-radius:12px; background:var(--card-secondary); border:1px solid var(--border); margin-top:8px; }
.legacy-account-row .pick-info{ flex:1; min-width:0; }
.account-choice-row{ width:100%; text-align:left; }
.account-choice-row:hover{ border-color:var(--purple-neon); }
.account-choice-row > .icon{ width:16px; height:16px; color:var(--text-muted); flex-shrink:0; }
.account-access-card{ display:flex; flex-direction:column; gap:15px; }
.account-access-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; }
.account-identity{ display:flex; align-items:center; gap:11px; min-width:0; }
.account-provider-icon{ width:42px; height:42px; border-radius:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:linear-gradient(135deg,var(--blue-soft),var(--accent-soft)); color:var(--purple-glow); border:1px solid var(--accent-border); }
.account-provider-icon .icon{ width:20px; height:20px; }
.account-identity-copy{ min-width:0; }
.account-identity-copy strong,.account-identity-copy span{ display:block; overflow-wrap:anywhere; }
.account-identity-copy strong{ font-size:13.5px; margin-bottom:3px; }
.account-identity-copy span{ font-size:11.5px; color:var(--text-secondary); }
.account-provider-badge{ flex-shrink:0; padding:5px 9px; border-radius:999px; font-size:10.5px; font-weight:700; color:var(--blue); background:var(--blue-soft); border:1px solid color-mix(in srgb,var(--blue) 24%,transparent); }
.account-actions{ display:flex; gap:8px; flex-wrap:wrap; }
.account-security-note{ font-size:11.5px; line-height:1.5; color:var(--text-secondary); padding:10px 12px; border-radius:11px; background:var(--card-secondary); border:1px solid var(--border); }
.help-optin-layer{ position:fixed; inset:0; z-index:420; display:flex; align-items:center; justify-content:center; padding:22px; }
.help-optin-backdrop{ position:absolute; inset:0; background:color-mix(in srgb,var(--bg) 82%,transparent); backdrop-filter:blur(8px); }
.help-optin-card{ position:relative; z-index:1; width:min(480px,100%); padding:27px; border-radius:22px; background:linear-gradient(155deg,var(--card-premium),var(--card)); border:1px solid var(--accent-border); box-shadow:0 32px 80px -24px var(--shadow-color); animation:fadeInUp .35s ease both; }
.help-welcome-icon{ width:58px; height:58px; display:flex; align-items:center; justify-content:center; border-radius:18px; margin-bottom:17px; background:linear-gradient(135deg,var(--blue),var(--purple-neon)); color:var(--on-accent); box-shadow:0 14px 30px -14px color-mix(in srgb,var(--purple-neon) 75%,transparent); }
.help-welcome-icon .icon{ width:28px; height:28px; }
.help-optin-card h2{ margin:4px 0 9px; }
.help-optin-card > p{ font-size:13px; line-height:1.6; }
.help-optin-points{ display:grid; gap:8px; margin:17px 0; }
.help-optin-point{ display:flex; align-items:flex-start; gap:8px; color:var(--text-secondary); font-size:12px; }
.help-optin-point .icon{ width:15px; height:15px; color:var(--green); flex-shrink:0; margin-top:1px; }
.help-optin-actions{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.help-floating{ position:fixed; right:24px; bottom:24px; z-index:230; width:min(370px,calc(100vw - 32px)); padding:18px; border-radius:18px; background:linear-gradient(150deg,var(--card-premium),var(--card)); border:1px solid var(--accent-border); box-shadow:0 26px 58px -20px var(--shadow-color); animation:fadeInUp .3s ease both; }
.help-floating-head{ display:flex; align-items:flex-start; gap:11px; }
.help-floating-icon{ width:38px; height:38px; display:flex; align-items:center; justify-content:center; border-radius:12px; flex-shrink:0; background:var(--accent-soft); color:var(--purple-glow); }
.help-floating-icon .icon{ width:19px; height:19px; }
.help-floating-copy{ min-width:0; flex:1; }
.help-floating-copy strong{ display:block; font-size:13.5px; margin-bottom:5px; }
.help-floating-copy p{ font-size:11.8px; line-height:1.5; color:var(--text-secondary); }
.help-floating-progress{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin:13px 0 9px; color:var(--text-muted); font-size:10.5px; font-family:var(--font-mono); }
.help-floating-actions{ display:flex; gap:7px; flex-wrap:wrap; }
.help-floating-actions .btn{ flex:1; padding-inline:11px; }
.help-stop{ width:100%; margin-top:9px; text-align:center; color:var(--text-muted); font-size:10.5px; }
.help-stop:hover{ color:var(--danger); }
.profile-pick-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
.profile-pick-card{ display:flex; align-items:center; gap:8px; background:var(--card-secondary); border:1px solid var(--border); border-radius:var(--radius-md); padding:6px; }
.profile-pick-main{ flex:1; display:flex; align-items:center; gap:14px; padding:10px 12px; border-radius:12px; text-align:left; }
.profile-pick-main:hover{ background:color-mix(in srgb,var(--text-secondary) 10%,transparent); }
.pick-emoji{ font-size:26px; width:44px; height:44px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--purple-neon) 32%,transparent),color-mix(in srgb,var(--bg) 16%,transparent) 70%); border-radius:50%; }
.pick-info{ display:flex; flex-direction:column; gap:2px; }
.pick-name{ font-weight:600; font-size:14.5px; }
.pick-level{ font-size:12px; font-family:var(--font-mono); }
.pick-delete{ flex-shrink:0; margin-right:4px; }
.pick-confirm{ display:flex; gap:6px; padding-right:6px; flex-shrink:0; }
.create-profile-btn{ width:100%; justify-content:center; }

/* ---------- Responsive parity: celular e tablet ---------- */
@media (max-width:768px){
  .card,.stat-card,.kanban-col,.shop-card,.auth-card{ min-width:0; }
  .card{ padding:18px; }
  .stat-card{ padding:15px; }
  .section-header{ margin:16px 0 13px; }
  .section-header h2{ overflow-wrap:anywhere; }
  .tabs,.filter-tabs{ flex-wrap:nowrap; overflow-x:auto; overscroll-behavior-inline:contain; scrollbar-width:none; scroll-snap-type:x proximity; padding:2px 1px 8px; margin-inline:-2px; }
  .tabs,.filter-tabs,.theme-row,.timer-presets,.context-chips{ -webkit-overflow-scrolling:touch; }
  .tabs::-webkit-scrollbar,.filter-tabs::-webkit-scrollbar,.theme-row::-webkit-scrollbar,.timer-presets::-webkit-scrollbar{ display:none; }
  .tab{ flex:0 0 auto; min-height:42px; scroll-snap-align:start; }
  .btn{ min-height:44px; max-width:100%; }
  .icon-btn,.habit-check,.edit-trigger-btn,.delete-trigger-btn,.milestone-check{ min-width:44px; width:44px; min-height:44px; height:44px; }
  .switch{ min-width:46px; width:46px; height:28px; }
  .switch .switch-knob{ width:22px; height:22px; }
  .switch.on .switch-knob{ transform:translateX(18px); }
  input:not([type="checkbox"]):not([type="range"]),select,textarea{ min-height:44px; font-size:16px; }
  .day-pick-btn{ width:40px; height:40px; min-width:40px; }
  .timer-preset{ min-height:40px; }
  .coach-preview,.suggestion-card{ text-align:left; }
  .kanban{ grid-template-columns:1fr; }
  .kanban-col{ scroll-margin-top:12px; }
  .task-actions .icon-btn{ flex:1; width:auto; }
  .shop-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  .shop-card{ padding:17px; }
  .shop-desc{ min-height:0; }
  .report-hero{ align-items:center; }
  .report-hero .btn{ margin-left:auto; }
  .theme-row{ flex-wrap:nowrap; overflow-x:auto; overscroll-behavior-inline:contain; scrollbar-width:none; padding:4px 2px 10px; }
  .theme-swatch{ flex:0 0 84px; min-height:72px; }
  .settings-row{ gap:14px; }
  .area-chart{ min-height:180px; }
}

  .btn{ white-space:normal; text-align:center; }
  .pill-icon{ width:14px; height:14px; }
  h2{ font-size:21px; }
  h3{ overflow-wrap:anywhere; }
  p,.task-title,.goal-text,.habit-name,.milestone-text,.ritual-text{ overflow-wrap:anywhere; }
  .card{ padding:16px; border-radius:16px; }
  .stat-row,.stat-row.four,.focus-stats{ grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  .stat-card{ padding:14px; gap:8px; }
  .stat-value{ font-size:24px; gap:5px; }
  .stat-value.small{ font-size:20px; }
  .stat-suffix{ font-size:10.5px; }
  .stat-label{ font-size:10.5px; }
  .week-dots{ gap:4px; }
  .mission-head{ flex-direction:column; }
  .mission-reward{ white-space:normal; }
  .focus-hero{ gap:16px; }
  .focus-hero-actions{ width:100%; align-items:stretch; }
  .focus-hero-actions .btn,.focus-hero-actions .focus-mode-badge{ width:100%; justify-content:center; }
  .focus-project-title{ font-size:24px; }
  .timer-dial{ width:min(190px,calc(100vw - 92px)); height:auto; aspect-ratio:1; }
  .timer-actions{ flex-direction:column; }
  .timer-actions .btn{ width:100%; }
  .timer-presets{ justify-content:flex-start; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; padding-bottom:4px; }
  .timer-preset{ flex:0 0 auto; }
  .focus-progress-meta,.session-row{ flex-wrap:wrap; }
  .health-score-row{ align-items:flex-start; }
  .ritual-item,.milestone-item{ min-height:54px; }
  .ritual-check{ min-width:34px; width:34px; min-height:34px; height:34px; }
  .quick-add,.quick-add-habit .quick-add{ flex-direction:column; gap:9px; }
  .quick-add input,.quick-add select,.quick-add .btn{ width:100%; }
  .quick-add-row2{ display:grid; grid-template-columns:1fr; gap:8px; }
  .quick-add-row2 > input,.quick-add-row2 > .btn{ width:100%; }
  .quick-add-row2 .qa-label:not(:first-child){ margin-top:5px; }
  .day-picker{ width:100%; justify-content:space-between; gap:5px; overflow-x:auto; }
  .schedule-edit{ flex-direction:column; align-items:stretch; }
  .schedule-edit select,.schedule-edit input,.schedule-edit .btn{ width:100%; }
  .schedule-row{ align-items:flex-start; }
  .schedule-days{ max-width:100%; overflow-x:auto; padding-bottom:2px; }
  .habit-card{ display:grid; grid-template-columns:auto minmax(0,1fr); align-items:start; gap:12px; }

  .coach-hero{ align-items:flex-start; }
  .context-chips{ flex-wrap:nowrap; overflow-x:auto; padding-bottom:5px; scrollbar-width:none; }

  .journal-box .btn{ width:100%; }
  .shop-grid{ grid-template-columns:1fr; }
  .shop-card{ padding:18px; }
  .wallpaper-preview{ height:104px; }
  .store-balance-card{ align-items:flex-start; }
  .balance-value{ flex-wrap:wrap; font-size:21px; }
  .inv-list{ flex-direction:column; }
  .inv-item{ width:100%; display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; border-radius:14px; }
  .inv-name{ white-space:normal; overflow-wrap:anywhere; }
  .report-hero{ flex-direction:column; align-items:stretch; text-align:center; }
  .report-hero .ring-wrap{ align-self:center; }
  .report-stats{ justify-content:space-around; gap:12px; }
  .report-hero .btn{ width:100%; margin-left:0; }
  .profile-hero{ flex-direction:column; align-items:center; text-align:center; }
  .profile-info{ width:100%; min-width:0; }
  .profile-name-row{ justify-content:center; flex-wrap:wrap; }
  .achv-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
  .achv-card{ padding:13px 9px; }
  .settings-row{ align-items:center; flex-wrap:wrap; }
  .settings-row > span:first-child{ flex:1 1 190px; }
  .name-edit{ width:100%; flex-wrap:wrap; }
  .name-edit input{ width:100%; flex:1 1 100%; }
  .name-edit .btn{ width:100%; }
  .auth-screen{ padding:12px; align-items:flex-start; padding-top:max(18px,env(safe-area-inset-top)); }
  .auth-card{ padding:24px 18px; }
  .auth-providers,.password-rules{ grid-template-columns:1fr; }
  .recovery-methods{ grid-template-columns:1fr 1fr; }
  .account-access-head{ flex-direction:column; }
  .account-actions{ display:grid; grid-template-columns:1fr; }
  .account-actions .btn{ width:100%; }
  .legacy-account-row{ align-items:stretch; flex-wrap:wrap; }
  .legacy-account-row .btn{ width:100%; }
  .help-optin-layer{ align-items:flex-end; padding:12px max(12px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left)); }
  .help-optin-card{ padding:22px 18px; border-radius:20px; }
  .help-optin-actions{ grid-template-columns:1fr; }
  .help-floating{ right:max(12px,env(safe-area-inset-right)); bottom:calc(84px + env(safe-area-inset-bottom)); width:calc(100vw - max(24px,env(safe-area-inset-left) + env(safe-area-inset-right))); padding:16px; }

  .pick-info{ min-width:0; }
  .pick-name{ overflow-wrap:anywhere; }
  .pick-confirm{ width:100%; padding:0 6px 6px; }

@media (max-width:380px){

  .mobile-nav-grid{ gap:7px; }
  .mobile-nav-link{ padding:10px 9px; font-size:11.5px; }

  .day-pick-btn{ min-width:37px; width:37px; height:37px; }
  .achv-grid{ grid-template-columns:1fr 1fr; }
}

@media (max-width:1100px) and (max-height:560px){
  .mobile-nav-sheet{ top:6px; bottom:6px; padding-bottom:78px; }
  .mobile-nav-grid{ grid-template-columns:repeat(3,minmax(0,1fr)); }
  .mobile-nav-link{ min-height:50px; }
}

/* ---------- Effects ---------- */
#particles-overlay{ position:fixed; inset:0; pointer-events:none; z-index:9998; overflow:hidden; }
.particle{ position:fixed; width:8px; height:8px; border-radius:2px; pointer-events:none; animation:particlePop .9s ease-out forwards; z-index:9998; }
#toast-root{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%); z-index:10000; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
@media (max-width:1100px){ #toast-root{ bottom:90px; } }
.toast{ background:var(--card-premium); border:1px solid var(--border); padding:11px 20px; border-radius:999px; font-size:13px; font-weight:500; opacity:0; transform:translateY(10px); transition:opacity .3s ease,transform .3s ease; box-shadow:0 12px 30px var(--shadow-color); }
.toast.show{ opacity:1; transform:translateY(0); }
.toast-success{ border-color:color-mix(in srgb,var(--green) 48%,transparent); }
.toast-error{ border-color:color-mix(in srgb,var(--danger) 48%,transparent); color:var(--danger); }
.notification-device-card{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px; border-radius:var(--radius-sm); background:var(--card-secondary); border:1px solid var(--border); margin-bottom:14px; }
.notification-device-copy{ display:flex; align-items:flex-start; gap:11px; min-width:0; }
.notification-device-copy .icon{ color:var(--purple-glow); flex-shrink:0; margin-top:2px; }
.notification-device-copy strong{ display:block; margin-bottom:3px; }
.notification-device-actions{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
.notification-state{ font-size:11px; color:var(--text-secondary); line-height:1.45; }
@media(max-width:680px){
  .notification-device-card{ align-items:stretch; flex-direction:column; }
  .notification-device-actions{ justify-content:stretch; }
  .notification-device-actions .btn{ flex:1; }
}

/* ---------- Keyframes ---------- */
@keyframes fadeInUp{ from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:translateY(0);} }
@keyframes glowPulse{ 0%,100%{ box-shadow:0 0 18px 2px color-mix(in srgb,var(--purple-neon) 36%,transparent);} 50%{ box-shadow:0 0 30px 6px color-mix(in srgb,var(--purple-neon) 62%,transparent);} }
@keyframes floatY{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-6px);} }
@keyframes fillBar{ from{ width:0;} to{ width:var(--w,0%);} }
@keyframes ringFill{ from{ stroke-dashoffset:var(--circ);} to{ stroke-dashoffset:var(--off);} }
@keyframes particlePop{ 0%{ transform:translate(0,0) rotate(0deg); opacity:1;} 100%{ transform:translate(var(--tx),var(--ty)) rotate(var(--r)); opacity:0;} }
@keyframes scanSweep{ 0%{ background-position:0% 0%;} 100%{ background-position:100% 100%;} }
@keyframes popCheck{ 0%{ transform:scale(.7);} 60%{ transform:scale(1.15);} 100%{ transform:scale(1);} }
@keyframes wallpaperPreviewShine{ 0%,22%{ transform:translateX(-55%) rotate(18deg);} 72%,100%{ transform:translateX(55%) rotate(18deg);} }

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
}

/* ---------- Backend compartilhado + PWA ---------- */
const KAIZEN_API_BASE = String((window.KAIZEN_CONFIG||{}).apiBase||'/api/v1').replace(/\/$/,'');
function backendEnabled(){
  const protocol=window.location && window.location.protocol ? window.location.protocol : 'file:';
  return /^https?:$/.test(protocol) && !!KAIZEN_API_BASE;
}
function apiErrorMessage(data,status){
  if(data && typeof data.detail==='string') return data.detail;
  if(data && data.detail && typeof data.detail.message==='string') return data.detail.message;
  if(data && Array.isArray(data.detail) && data.detail[0] && data.detail[0].msg) return data.detail[0].msg;
  return status===401?'Sua sessão expirou. Entre novamente.':'Não foi possível concluir a operação.';
}
async function apiRequest(path,options,retry){
  if(!backendEnabled()) throw new Error('Backend indisponível nesta forma de abertura.');
  const opts=Object.assign({method:'GET',credentials:'include',headers:{}},options||{});
  opts.headers=Object.assign({},opts.headers);
  if(opts.body && typeof opts.body!=='string'){
    opts.headers['Content-Type']='application/json';
    opts.body=JSON.stringify(opts.body);
  }
  if(session.accessToken) opts.headers.Authorization='Bearer '+session.accessToken;
  let response;
  try{ response=await fetch(KAIZEN_API_BASE+path,opts); }
  catch(networkError){
    networkError.isNetworkError=true;
    throw networkError;
  }
  if(response.status===401 && retry!==false && path!=='/auth/refresh'){
    const refreshed=await refreshBackendSession(false);
    if(refreshed) return apiRequest(path,options,false);
  }
  const data=response.status===204?null:await response.json().catch(function(){return null;});
  if(!response.ok){
    const error=new Error(apiErrorMessage(data,response.status));
    error.status=response.status;
    error.data=data;
    throw error;
  }
  return data;
}

/* ---------- Fila offline persistente ---------- */
const SYNC_DB_NAME='kaizen-offline-sync';
const SYNC_DB_VERSION=1;
const SYNC_STORE='mutations';
function createBackendEntityId(){
  if(window.crypto && typeof window.crypto.randomUUID==='function') return window.crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(char){
    const random=Math.floor(Math.random()*16);
    return (char==='x'?random:(random&3|8)).toString(16);
  });
}
function openSyncDatabase(){
  return new Promise(function(resolve,reject){
    if(!window.indexedDB){ reject(new Error('Armazenamento offline indisponível.')); return; }
    const request=indexedDB.open(SYNC_DB_NAME,SYNC_DB_VERSION);
    request.onupgradeneeded=function(){
      const db=request.result;
      if(!db.objectStoreNames.contains(SYNC_STORE)){
        const store=db.createObjectStore(SYNC_STORE,{keyPath:'id'});
        store.createIndex('userId','userId',{unique:false});
      }
    };
    request.onsuccess=function(){ resolve(request.result); };
    request.onerror=function(){ reject(request.error||new Error('Falha ao abrir a fila offline.')); };
  });
}
async function allSyncMutations(){
  const db=await openSyncDatabase();
  return new Promise(function(resolve,reject){
    const transaction=db.transaction(SYNC_STORE,'readonly');
    const request=transaction.objectStore(SYNC_STORE).getAll();
    request.onsuccess=function(){ resolve(request.result||[]); };
    request.onerror=function(){ reject(request.error); };
    transaction.oncomplete=function(){ db.close(); };
    transaction.onerror=function(){ db.close(); reject(transaction.error); };
  });
}
async function putSyncMutation(mutation){
  const db=await openSyncDatabase();
  return new Promise(function(resolve,reject){
    const transaction=db.transaction(SYNC_STORE,'readwrite');
    transaction.objectStore(SYNC_STORE).put(mutation);
    transaction.oncomplete=function(){ db.close(); resolve(); };
    transaction.onerror=function(){ db.close(); reject(transaction.error); };
  });
}
async function removeSyncMutations(ids){
  if(!ids.length) return;
  const db=await openSyncDatabase();
  return new Promise(function(resolve,reject){
    const transaction=db.transaction(SYNC_STORE,'readwrite');
    const store=transaction.objectStore(SYNC_STORE);
    ids.forEach(function(id){ store.delete(id); });
    transaction.oncomplete=function(){ db.close(); resolve(); };
    transaction.onerror=function(){ db.close(); reject(transaction.error); };
  });
}
function currentSyncUserId(){ return session.apiUser && session.apiUser.id ? session.apiUser.id : null; }
async function refreshSyncQueueState(shouldRender){
  const userId=currentSyncUserId();
  if(!userId || !window.indexedDB){ session.syncPending=0; session.syncConflicts=0; return; }
  try{
    const items=(await allSyncMutations()).filter(function(item){return item.userId===userId;});
    session.syncPending=items.length;
    session.syncConflicts=items.filter(function(item){return item.status==='conflict';}).length;
  }catch(error){ session.syncMessage='Não foi possível consultar a fila offline.'; }
  if(shouldRender && session.view==='app' && state && state.currentPage==='settings') renderApp();
}
async function enqueueOfflineMutation(path,options,meta){
  const userId=currentSyncUserId();
  if(!userId) throw new Error('Entre na conta antes de salvar alterações offline.');
  const method=String((options&&options.method)||'POST').toUpperCase();
  const body=(options&&options.body&&typeof options.body==='object') ? Object.assign({},options.body) : null;
  const details=Object.assign({entityType:null,entityId:null},meta||{});
  const items=(await allSyncMutations()).filter(function(item){return item.userId===userId;});
  const sameEntity=items.filter(function(item){
    return details.entityId && item.entityType===details.entityType && item.entityId===details.entityId;
  });
  const pendingCreate=sameEntity.find(function(item){return item.method==='POST';});
  if(method==='DELETE' && pendingCreate){
    await removeSyncMutations(sameEntity.map(function(item){return item.id;}));
    await refreshSyncQueueState(true);
    return {queued:true,cancelledCreate:true};
  }
  if(method==='PATCH' && pendingCreate){
    const patchBody=Object.assign({},body||{});
    delete patchBody.expected_version;
    pendingCreate.body=Object.assign({},pendingCreate.body||{},patchBody);
    pendingCreate.updatedAt=Date.now();
    await putSyncMutation(pendingCreate);
    await refreshSyncQueueState(true);
    return {queued:true};
  }
  let reusable=null;
  if(method==='PATCH') reusable=sameEntity.find(function(item){return item.method==='PATCH'&&item.path===path;});
  if(/\/completions\//.test(path)) reusable=items.find(function(item){return item.path===path;});
  if(reusable){
    reusable.method=method;
    reusable.body=method==='PATCH'?Object.assign({},reusable.body||{},body||{}):body;
    reusable.status='pending';
    reusable.updatedAt=Date.now();
    await putSyncMutation(reusable);
  }else{
    await putSyncMutation({
      id:createBackendEntityId(),userId:userId,path:path,method:method,body:body,
      entityType:details.entityType,entityId:details.entityId,status:'pending',attempts:0,
      createdAt:Date.now(),updatedAt:Date.now(),lastError:null
    });
  }
  await refreshSyncQueueState(true);
  return {queued:true};
}
async function apiMutation(path,options,meta){
  if(meta && meta.entityId && currentSyncUserId() && window.indexedDB){
    try{
      const queued=(await allSyncMutations()).some(function(item){
        return item.userId===currentSyncUserId() && item.entityType===meta.entityType && item.entityId===meta.entityId;
      });
      if(queued) return enqueueOfflineMutation(path,options,meta);
    }catch(error){ console.warn('Fila offline indisponível; tentando envio direto.',error); }
  }
  if(navigator.onLine===false) return enqueueOfflineMutation(path,options,meta);
  try{ return await apiRequest(path,options); }
  catch(error){
    if(error.isNetworkError) return enqueueOfflineMutation(path,options,meta);
    throw error;
  }
}
async function flushMutationQueue(showFeedback){
  const userId=currentSyncUserId();
  if(!userId || !window.indexedDB || session.syncRunning) return false;
  if(navigator.onLine===false){
    if(showFeedback) toast('Você ainda está sem internet. As alterações continuam protegidas.','error');
    return false;
  }
  session.syncRunning=true;
  session.syncMessage='Sincronizando alterações pendentes...';
  if(showFeedback && state && state.currentPage==='settings') renderApp();
  let blocked=false;
  try{
    const items=(await allSyncMutations())
      .filter(function(item){return item.userId===userId;})
      .sort(function(a,b){return a.createdAt-b.createdAt;});
    for(const item of items){
      try{
        await apiRequest(item.path,{method:item.method,body:item.body});
        await removeSyncMutations([item.id]);
      }catch(error){
        if(item.method==='DELETE' && error.status===404){ await removeSyncMutations([item.id]); continue; }
        item.attempts=(item.attempts||0)+1;
        item.lastError=error.message;
        item.updatedAt=Date.now();
        if(error.status===409 || (error.status>=400 && error.status<500 && error.status!==401)){
          item.status='conflict';
          blocked=true;
          await putSyncMutation(item);
          continue;
        }
        item.status='pending';
        await putSyncMutation(item);
        blocked=true;
        break;
      }
    }
    await refreshSyncQueueState(false);
    if(!blocked && session.syncPending===0 && state){
      await syncFromBackend();
      session.syncMessage='Tudo sincronizado.';
      if(showFeedback) toast('Alterações sincronizadas com sucesso.','success');
    }else if(session.syncConflicts){
      session.syncMessage='Há alterações que conflitam com outro dispositivo.';
      if(showFeedback) toast('Existe um conflito para revisar nas Configurações.','error');
    }else{
      session.syncMessage='A sincronização continuará quando a conexão estabilizar.';
    }
  }finally{
    session.syncRunning=false;
    await refreshSyncQueueState(false);
    if(session.view==='app' && state && state.currentPage==='settings') renderApp();
  }
  return !blocked;
}
async function discardSyncConflicts(){
  const userId=currentSyncUserId();
  const items=(await allSyncMutations()).filter(function(item){
    return item.userId===userId && item.status==='conflict';
  });
  await removeSyncMutations(items.map(function(item){return item.id;}));
  await refreshSyncQueueState(false);
  await syncFromBackend();
  session.syncMessage='Os conflitos foram restaurados com os dados do servidor.';
}

function oauthCodeFromUrl(url){

function oauthErrorFromUrl(url){
  try{ return new URL(url).searchParams.get('oauth_error'); }catch(error){ return null; }

function clearOAuthUrlParameter(url,name){
  if(isNativeKaizenApp() || !window.history || !window.history.replaceState) return;

async function finishGoogleOAuth(code,url){

function registerNativeOAuthListener(){

function urlBase64ToUint8Array(value){
  const padding='='.repeat((4-value.length%4)%4);
  const base64=(value+padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw=window.atob(base64);
  return Uint8Array.from(Array.from(raw).map(function(char){return char.charCodeAt(0);}));
}
function browserNotificationPermission(){

async function enableWebNotifications(){
  if(!window.isSecureContext) throw new Error('Notificações exigem HTTPS ou localhost.');
  if(!('Notification' in window) || !('PushManager' in window)) throw new Error('Este navegador não oferece Web Push.');
  await refreshNotificationState(true);
  const status=session.notificationState||{};
  if(!status.server_enabled || !status.vapid_public_key) throw new Error('Web Push ainda não foi configurado no servidor.');
  const permission=await Notification.requestPermission();
  if(permission!=='granted') throw new Error(permission==='denied'?'A permissão foi bloqueada no navegador.':'A permissão não foi concedida.');
  const registration=await registerKaizenServiceWorker();
  if(!registration) throw new Error('Não foi possível ativar o service worker.');
  let subscription=await registration.pushManager.getSubscription();
  if(!subscription){
    subscription=await registration.pushManager.subscribe({
      userVisibleOnly:true,
      applicationServerKey:urlBase64ToUint8Array(status.vapid_public_key)
    });
  }
  const json=subscription.toJSON();
  await apiRequest('/notifications/devices',{method:'POST',body:{
    channel:'web_push',endpoint:json.endpoint,p256dh:json.keys.p256dh,auth:json.keys.auth,
    platform:'web',device_name:navigator.platform||'Navegador'
  }});
}
async function enableNativeNotifications(){
  const capacitor=window.Capacitor;
  const plugin=capacitor && capacitor.Plugins && capacitor.Plugins.PushNotifications;
  if(!plugin) throw new Error('O plugin nativo de notificações não está instalado.');
  let permission=await plugin.checkPermissions();
  if(permission.receive==='prompt') permission=await plugin.requestPermissions();
  session.notificationState=session.notificationState||{};
  session.notificationState.nativePermission=permission.receive;
  if(permission.receive!=='granted') throw new Error('A permissão de notificação não foi concedida.');
  let token=await new Promise(async function(resolve,reject){
    let settled=false;
    await plugin.addListener('registration',function(result){ if(!settled){settled=true;resolve(result.value);} });
    await plugin.addListener('registrationError',function(error){ if(!settled){settled=true;reject(new Error(error.error||'Falha no registro nativo.'));} });
    await plugin.register();
    setTimeout(function(){ if(!settled){settled=true;reject(new Error('O registro nativo demorou demais.'));} },15000);
  });
  const platform=capacitor.getPlatform();
  if(platform==='ios'){
    const fcm=capacitor.Plugins && capacitor.Plugins.FCM;
    if(!fcm || !fcm.getToken) throw new Error('O plugin FCM do iOS não está instalado.');
    const fcmResult=await fcm.getToken();
    token=fcmResult && fcmResult.token;
    if(!token) throw new Error('O Firebase não devolveu um token para este iPhone ou iPad.');
  }
  await storageSet('kaizen-native-push-token',token);
  await apiRequest('/notifications/devices',{method:'POST',body:{
    channel:'fcm',native_token:token,platform:platform,device_name:platform+' Kaizen'
  }});
}
async function enableDeviceNotifications(){
  if(!session.accessToken) throw new Error('Entre em uma conta conectada ao backend primeiro.');
  const native=window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();
  if(native) await enableNativeNotifications(); else await enableWebNotifications();
  await refreshNotificationState(true);
}
async function disableDeviceNotifications(){
  const native=window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();
  if(native){
    const token=await storageGet('kaizen-native-push-token');
    if(token) await apiRequest('/notifications/devices/remove',{method:'POST',body:{channel:'fcm',native_token:token}});
    const plugin=window.Capacitor.Plugins.PushNotifications;
    if(plugin && plugin.unregister) await plugin.unregister();
    await storageDelete('kaizen-native-push-token');
  }else{
    const registration=await navigator.serviceWorker.getRegistration('./sw.js');
    const subscription=registration && await registration.pushManager.getSubscription();
    if(subscription){
      await apiRequest('/notifications/devices/remove',{method:'POST',body:{channel:'web_push',endpoint:subscription.endpoint}});
      await subscription.unsubscribe();
    }
  }
  await refreshNotificationState(true);
}

  const year = d.getFullYear();
  const month = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');

}
function formatLocalDateTime(value){

}

function hydrateFocusProject(raw){
  const defaults = createDefaultFocusProject(false);
  const project = Object.assign({}, defaults, raw || {});
  project.ritual = Object.assign({}, defaults.ritual, (raw && raw.ritual) || {});
  project.health = Object.assign({}, defaults.health, (raw && raw.health) || {});
  project.timer = Object.assign({}, defaults.timer, (raw && raw.timer) || {});
  project.milestones = Array.isArray(project.milestones) ? project.milestones : [];
  project.sessions = Array.isArray(project.sessions) ? project.sessions : [];
  project.editing = false;
  delete project.editingOriginalMode;
  if(project.timer.running && project.timer.startedAt){
    const elapsed = Math.floor((Date.now()-project.timer.startedAt)/1000);
    project.timer.remaining = Math.max(0, Number(project.timer.remaining||0)-elapsed);
    project.timer.startedAt = Date.now();
    if(project.timer.remaining<=0) project.timer.running = false;
  }
  return project;
